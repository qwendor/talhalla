function fitCanvas() {

// ---------------- Audio (tiny synth, no assets) ----------------
let audioCtx = null;
let musicGain = null, musicMuted = false;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (audioCtx && !musicGain) {
    musicGain = audioCtx.createGain();
    musicGain.gain.value = musicMuted ? 0 : 0.5;
    musicGain.connect(audioCtx.destination);
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}
function toggleMusic() {
  musicMuted = !musicMuted;
  if (musicGain) musicGain.gain.value = musicMuted ? 0 : 0.5;
}
function beep(freq, dur, type, vol, slide) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type || "square";
  o.frequency.setValueAtTime(freq, audioCtx.currentTime);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), audioCtx.currentTime + dur);
  g.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}

const NOTE = m => 440 * Math.pow(2, (m - 69) / 12);
let music = { key: null, song: null, tracks: [], pos: [], drumT: 0, di: 0 };

function setMusic(key) {
  if (music.key === key) return;
  const song = SONGS[key] || null;
  const tracks = [];
  if (song) {
    tracks.push({ notes: song.mel, type: song.melType, vol: song.melVol });
    tracks.push({ notes: song.bass, type: song.bassType, vol: song.bassVol });
    for (const ex of song.extra || []) tracks.push(ex);
  }
  music = { key, song, tracks, pos: tracks.map(() => ({ t: 0, i: 0 })), drumT: 0, di: 0 };
}

// --- synthesized drum kit ---
let noiseBuf = null;
function getNoise() {
  if (!noiseBuf) {
    noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.2 | 0, audioCtx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return noiseBuf;
}
function playDrum(kind, at) {
  if (!kind || kind === "rest") return;
  if (kind === "kick") {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(120, at);
    o.frequency.exponentialRampToValueAtTime(40, at + 0.12);
    g.gain.setValueAtTime(0.16, at);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 0.15);
    o.connect(g); g.connect(musicGain);
    o.start(at); o.stop(at + 0.2);
  } else { // hat / snare: filtered noise burst
    const src = audioCtx.createBufferSource();
    src.buffer = getNoise();
    const f = audioCtx.createBiquadFilter();
    f.type = "highpass";
    f.frequency.value = kind === "snare" ? 1800 : 6000;
    const g = audioCtx.createGain();
    const vol = kind === "snare" ? 0.08 : 0.04;
    const dur = kind === "snare" ? 0.09 : 0.04;
    g.gain.setValueAtTime(vol, at);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    src.connect(f); f.connect(g); g.connect(musicGain);
    src.start(at); src.stop(at + dur + 0.02);
  }
}

function playNote(midi, at, dur, type, vol) {
  if (midi <= 0) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type;
  o.frequency.value = NOTE(midi);
  g.gain.setValueAtTime(0.0001, at);
  g.gain.linearRampToValueAtTime(vol, at + 0.02);
  g.gain.setValueAtTime(vol, at + dur * 0.6);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g); g.connect(musicGain);
  o.start(at); o.stop(at + dur + 0.05);
}

function tickMusic() {
  if (!audioCtx || audioCtx.state !== "running" || !musicGain || !music.song) return;
  const s = music.song;
  const spb = 60 / s.bpm;
  const now = audioCtx.currentTime;
  const ahead = now + 0.3; // schedule 300ms ahead
  for (let k = 0; k < music.tracks.length; k++) {
    const tr = music.tracks[k], p = music.pos[k];
    if (p.t < now) p.t = now + 0.05; // resync after pauses
    while (p.t < ahead) {
      const [n, b] = tr.notes[p.i % tr.notes.length];
      playNote(n, p.t, b * spb * (tr.sustain || 0.92), tr.type, tr.vol);
      p.t += b * spb; p.i++;
    }
  }
  if (s.drums) {
    if (music.drumT < now) music.drumT = now + 0.05;
    while (music.drumT < ahead) {
      const [kind, b] = s.drums[music.di % s.drums.length];
      playDrum(kind, music.drumT);
      music.drumT += b * spb; music.di++;
    }
  }
}

// ---------------- Gamepads ----------------
// Standard layout: A jump · X light · Y/B heavy · LB/RB/triggers dodge
// Left stick or D-pad to move. Pads #1-#4 -> P1-P4.
const DEAD = 0.35;
let padState = [null, null, null, null];
function pollPads() {
  padState = [null, null, null, null];
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let slot = 0;
  for (const gp of pads) {
    if (!gp || !gp.connected || slot > 3) continue;
    const b  = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
    const ax = i => gp.axes[i] || 0;
    padState[slot++] = {
      left:    ax(0) < -DEAD || b(14),
      right:   ax(0) >  DEAD || b(15),
      up:      b(0) || b(12),               // A or D-pad up = jump
      down:    ax(1) >  0.5  || b(13),
      light:   b(2),                        // X
      heavy:   b(3) || b(1),                // Y or B
      dodge:   b(4) || b(5) || b(6) || b(7),// bumpers / triggers
      navUp:   b(12) || ax(1) < -0.5,       // menu only
      navDown: b(13) || ax(1) >  0.5,
      confirm: b(0) || b(9),                // A or Start
      pause:   b(8) || b(9),                // Select or Start -> home menu
    };
  }
}
let padLatch = {};
function padMenuPressed(action) {
  const now = fighters.some(f => { const p = padState[f.padIndex]; return p && p[action]; });
  const was = !!padLatch[action];
  padLatch[action] = now;
  return now && !was;
}

// character-specific cosmetics, shared by in-game and select-screen rendering
function drawDecor(key, r, facing, colorDark) {
  if (key === "nyx") {
    // headband with trailing scarf
    ctx.fillStyle = "#141428";
    ctx.fillRect(r.x - 1, r.y + 7, r.w + 2, 7);
    const wob = Math.sin(performance.now() * 0.015) * 3;
    const bx = facing > 0 ? r.x - 15 : r.x + r.w + 1;
    ctx.fillStyle = colorDark;
    ctx.fillRect(bx, r.y + 7 + wob * 0.4, 14, 5);
    ctx.fillRect(bx + (facing > 0 ? -9 : 9), r.y + 13 - wob * 0.4, 10, 4);
  } else if (key === "tor") {
    // horned helmet
    ctx.fillStyle = colorDark;
    roundRect(r.x - 3, r.y - 6, r.w + 6, 15, 6); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(r.x, r.y); ctx.lineTo(r.x - 12, r.y - 17); ctx.lineTo(r.x + 9, r.y - 4);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(r.x + r.w, r.y); ctx.lineTo(r.x + r.w + 12, r.y - 17); ctx.lineTo(r.x + r.w - 9, r.y - 4);
    ctx.closePath(); ctx.fill();
  } else if (key === "sage") {
    // pointed wizard hat
    ctx.fillStyle = colorDark;
    ctx.beginPath();
    ctx.moveTo(r.x - 5, r.y + 3);
    ctx.lineTo(r.x + r.w + 5, r.y + 3);
    ctx.lineTo(r.x + r.w/2 + facing * 9, r.y - 22);
    ctx.closePath(); ctx.fill();
  } else if (key === "rex") {
    // knight's crest plume
    ctx.fillStyle = colorDark;
    ctx.fillRect(r.x + r.w/2 - 3, r.y - 13, 6, 13);
    ctx.beginPath();
    ctx.moveTo(r.x + r.w/2, r.y - 13);
    ctx.lineTo(r.x + r.w/2 - facing * 15, r.y - 5);
    ctx.lineTo(r.x + r.w/2, r.y - 1);
    ctx.closePath(); ctx.fill();
  } else if (key === "volt") {
    // lightning emblem on chest + flickering spark above
    const mx = r.x + r.w/2;
    ctx.strokeStyle = "#eaffff"; ctx.lineWidth = 2.5; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(mx - 5, r.y + 28); ctx.lineTo(mx + 3, r.y + 36);
    ctx.lineTo(mx - 3, r.y + 40); ctx.lineTo(mx + 5, r.y + 50);
    ctx.stroke();
    ctx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(performance.now() * 0.02));
    ctx.fillStyle = "#eaffff";
    ctx.beginPath(); ctx.arc(mx, r.y - 8, 3, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  } else if (key === "glacia") {
    // ice crown
    ctx.fillStyle = "#dff4ff";
    for (let k = 0; k < 3; k++) {
      const bx = r.x + r.w * (0.22 + 0.28 * k);
      ctx.beginPath();
      ctx.moveTo(bx - 6, r.y + 2);
      ctx.lineTo(bx, r.y - 11 - (k === 1 ? 6 : 0));
      ctx.lineTo(bx + 6, r.y + 2);
      ctx.closePath(); ctx.fill();
    }
  } else if (key === "fang") {
    // wolf ears + white fangs
    ctx.fillStyle = colorDark;
    ctx.beginPath();
    ctx.moveTo(r.x + 4, r.y + 3); ctx.lineTo(r.x + 1, r.y - 13); ctx.lineTo(r.x + 16, r.y - 1);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(r.x + r.w - 4, r.y + 3); ctx.lineTo(r.x + r.w - 1, r.y - 13); ctx.lineTo(r.x + r.w - 16, r.y - 1);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#ffffff";
    const fx = r.x + r.w/2 + facing * 9;
    ctx.beginPath(); ctx.moveTo(fx - 5, r.y + 26); ctx.lineTo(fx - 3, r.y + 33); ctx.lineTo(fx - 1, r.y + 26); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(fx + 1, r.y + 26); ctx.lineTo(fx + 3, r.y + 33); ctx.lineTo(fx + 5, r.y + 26); ctx.closePath(); ctx.fill();
  } else if (key === "wren") {
    // archer's hood swept back, with a jaunty feather
    ctx.fillStyle = colorDark;
    roundRect(r.x - 2, r.y - 4, r.w + 4, 13, 6); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(r.x + r.w/2 + facing * 8, r.y - 4);
    ctx.lineTo(r.x + r.w/2 - facing * 18, r.y - 13);
    ctx.lineTo(r.x + r.w/2 - facing * 6, r.y - 2);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#ffd9a0";
    ctx.beginPath();
    ctx.moveTo(r.x + r.w/2 - facing * 12, r.y - 9);
    ctx.lineTo(r.x + r.w/2 - facing * 24, r.y - 20);
    ctx.lineTo(r.x + r.w/2 - facing * 17, r.y - 7);
    ctx.closePath(); ctx.fill();
    // quiver strap across the chest
    ctx.strokeStyle = "#6a4a2a"; ctx.lineWidth = 4; ctx.lineCap = "round";
    ctx.beginPath();
    if (facing > 0) { ctx.moveTo(r.x + 3, r.y + 16); ctx.lineTo(r.x + r.w - 3, r.y + 36); }
    else            { ctx.moveTo(r.x + r.w - 3, r.y + 16); ctx.lineTo(r.x + 3, r.y + 36); }
    ctx.stroke();
  }
}

function drawFighterPreview(def, cx, footY, scale, color, colorDark) {
  const w = def.w * scale, h = def.h * scale;
  const r = { x: cx - w / 2, y: footY - h, w, h };
  if (def.key === "devourer" && bossImg && bossImg.complete) {
    ctx.lineWidth = 2; ctx.strokeStyle = color;
    roundRect(r.x - 3, r.y - 3, r.w + 6, r.h + 6, 8); ctx.stroke();
    ctx.drawImage(bossImg, r.x - 4, r.y - 6, r.w + 8, r.h + 8);
    return;
  }
  ctx.fillStyle = colorDark;
  roundRect(r.x - 2, r.y - 2, r.w + 4, r.h + 4, 10); ctx.fill();
  ctx.fillStyle = color;
  roundRect(r.x, r.y, r.w, r.h, 8); ctx.fill();
  ctx.fillStyle = "#0b0e1a";
  const ex = cx + 10 * scale;
  ctx.fillRect(ex - 3, r.y + 14 * scale, 6, 8);
  ctx.fillRect(ex + 9 * scale - 3, r.y + 14 * scale, 6, 8);
  drawDecor(def.key, r, 1, colorDark);
}

// ---------------- Weapon animations (cosmetic only) ----------------
function drawShuriken(x, y, r, rot, bright) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = bright ? "#eef4ff" : "#aeb8cc";
  ctx.beginPath();
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2;
    ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    ctx.lineTo(Math.cos(a + Math.PI/4) * r * 0.35, Math.sin(a + Math.PI/4) * r * 0.35);
  }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#39415a";
  ctx.beginPath(); ctx.arc(0, 0, r * 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// Renders each fighter's weapon during an attack. Driven by the attack's
// timing (startup/active/recovery) and hitbox dims, but draws nothing that
// affects gameplay — hit detection still uses hitbox() alone.
function drawWeapon(f) {
  const d = f.attack.def, t = f.attack.t;
  const inActive = t >= d.startup && t < d.startup + d.active;
  const windup = t < d.startup;
  const rec = t >= d.startup + d.active;
  const prog = windup ? t / d.startup : Math.min(1, (t - d.startup) / d.active);
  const recProg = rec ? Math.min(1, (t - d.startup - d.active) / d.recovery) : 0;
  const ease = p => 1 - (1 - p) * (1 - p);
  const cx = f.x, cy = f.y - f.h/2, fc = f.facing;

  switch (f.char.key) {

    case "nyx": { // fan of spinning ninja stars
      if (!d.w) break; // Shadow Step teleport: particles only
      const spin = t * 0.7;
      if (windup) { // star readied in hand
        drawShuriken(cx + fc * (f.w/2 + 3), cy + 2, 7, spin, false);
        break;
      }
      const reach = d.below ? d.h : d.w;
      const throwP = rec ? 1 : ease(prog);
      const dirX = d.below ? 0 : fc, dirY = d.below ? 1 : 0;
      for (let i = 0; i < 3; i++) {
        const dist = (f.w/2 + 6) + (reach - f.w/2 - 6) * throwP * (0.45 + 0.28 * i);
        const off = (i - 1) * 13;
        const sx = cx + dirX * dist + (d.below ? off : 0);
        const sy = cy + dirY * dist + (d.below ? 0 : off * 0.7);
        drawShuriken(sx, sy, 8, spin + i * 1.3, inActive);
      }
      break;
    }

    case "tor": { // baseball bat swing
      let ang;
      if (d.below) {
        ang = Math.PI/2 - fc * (windup ? 0.8 : 0.8 - ease(prog) * 1.6);
      } else if (d.around) {
        const s = windup ? -1 : -1 + ease(prog) * 2;
        ang = -Math.PI/2 + fc * s * 0.95;
      } else {
        const a = -2.3 + (windup ? 0 : ease(prog)) * 2.6;
        ang = fc > 0 ? a : Math.PI - a;
      }
      const len = Math.max(42, d.w * 0.85);
      ctx.save();
      ctx.translate(cx, cy); ctx.rotate(ang);
      if (inActive) { // swing streak behind the barrel
        ctx.strokeStyle = "rgba(255,177,77,0.35)";
        ctx.lineWidth = 16; ctx.lineCap = "round";
        ctx.beginPath(); ctx.arc(0, 0, len * 0.8, fc > 0 ? -0.9 : 0, fc > 0 ? 0 : 0.9); ctx.stroke();
      }
      ctx.lineCap = "round";
      ctx.strokeStyle = "#4a3220"; ctx.lineWidth = 8;   // grip
      ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(20, 0); ctx.stroke();
      ctx.strokeStyle = "#a86f3e"; ctx.lineWidth = 9;   // handle
      ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(len * 0.6, 0); ctx.stroke();
      ctx.strokeStyle = "#c08a52"; ctx.lineWidth = 15;  // barrel
      ctx.beginPath(); ctx.moveTo(len * 0.6, 0); ctx.lineTo(len, 0); ctx.stroke();
      ctx.restore();
      break;
    }

    case "sage": { // folding fan: unfolds on windup, sweeps on active
      const px = cx + fc * (f.w/2 - 2), py = cy + 2;
      const len = Math.max(38, d.w * 0.7);
      const open = windup ? ease(prog) : (rec ? Math.max(0.3, 1 - ease(recProg) * 0.7) : 1);
      const spread = 1.7 * open;
      let center;
      if (d.below) center = Math.PI/2 + fc * (inActive ? (ease(prog) - 0.5) * 0.9 : 0);
      else if (d.around) center = -Math.PI/2 + fc * (inActive ? (ease(prog) - 0.5) * 1.6 : -0.4);
      else {
        const sweep = inActive ? (ease(prog) - 0.5) * 1.4 : -0.6;
        center = fc > 0 ? sweep : Math.PI - sweep;
      }
      for (let i = 0; i < 7; i++) {
        const a = center - spread/2 + spread * (i / 6);
        ctx.strokeStyle = i % 2 ? "rgba(200,155,255,0.85)" : "rgba(240,228,255,0.65)";
        ctx.lineWidth = 6; ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(px + Math.cos(a) * len, py + Math.sin(a) * len);
        ctx.stroke();
      }
      ctx.strokeStyle = inActive ? "#c89bff" : "rgba(200,155,255,0.5)";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(px, py, len, center - spread/2, center + spread/2);
      ctx.stroke();
      break;
    }

    case "rex": { // spear thrust
      let ang;
      if (d.below) ang = Math.PI/2;
      else if (d.boostY !== undefined) ang = fc > 0 ? -0.6 : Math.PI + 0.6; // Pole Vault: up-forward
      else ang = fc > 0 ? -0.08 : Math.PI + 0.08;
      const reach = d.below ? d.h : d.w;
      let ext;
      if (windup) ext = 24 - ease(prog) * 12;                 // draw back
      else if (inActive) ext = 14 + (reach - 6) * ease(prog); // thrust!
      else ext = 14 + (reach - 6) * (1 - ease(recProg));      // retract
      const ux = Math.cos(ang), uy = Math.sin(ang);
      if (inActive) { // thrust streak
        ctx.strokeStyle = "rgba(155,255,176,0.4)"; ctx.lineWidth = 11; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(cx + ux * ext * 0.4, cy + uy * ext * 0.4); ctx.lineTo(cx + ux * ext, cy + uy * ext); ctx.stroke();
      }
      ctx.strokeStyle = "#8a6b4a"; ctx.lineWidth = 5; ctx.lineCap = "round"; // shaft
      ctx.beginPath(); ctx.moveTo(cx - ux * 16, cy - uy * 16); ctx.lineTo(cx + ux * ext, cy + uy * ext); ctx.stroke();
      ctx.fillStyle = inActive ? "#eef2ff" : "#b9c2d8"; // spearhead
      ctx.beginPath();
      ctx.moveTo(cx + ux * (ext + 15), cy + uy * (ext + 15));
      ctx.lineTo(cx + ux * ext - uy * 6, cy + uy * ext + ux * 6);
      ctx.lineTo(cx + ux * ext + uy * 6, cy + uy * ext - ux * 6);
      ctx.closePath(); ctx.fill();
      break;
    }

    case "volt": { // jagged lightning strike
      let x0, y0, x1, y1;
      if (d.below)       { x0 = cx; y0 = cy + 6;  x1 = cx; y1 = cy + d.h; }
      else if (d.around) { x0 = cx; y0 = cy - 6;  x1 = cx; y1 = cy - d.h * 0.9; }
      else { // bolt crashes down from the sky onto the strike zone
        const bx = cx + fc * d.w * 0.62;
        x0 = bx; y0 = cy - 130; x1 = bx; y1 = cy + f.h * 0.4;
      }
      const seed = Math.floor(t / 2) * 7.3;
      const segs = 6;
      const pts = [];
      for (let i = 0; i <= segs; i++) {
        const p = i / segs;
        const off = (i === 0 || i === segs) ? 0 : (Math.abs(Math.sin(seed + i * 13.7) * 437.5) % 1 - 0.5) * 22;
        pts.push([x0 + (x1 - x0) * p + off, y0 + (y1 - y0) * p]);
      }
      const passes = inActive ? [[7, "rgba(200,240,255,0.45)"], [2.5, "#ffffff"]] : [[2, "rgba(200,240,255,0.3)"]];
      for (const [lw, col] of passes) {
        ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = "round";
        ctx.beginPath();
        pts.forEach(([px, py], i) => i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py));
        ctx.stroke();
      }
      if (inActive) {
        ctx.fillStyle = "rgba(220,245,255,0.7)";
        ctx.beginPath(); ctx.arc(x1, y1, 7, 0, Math.PI * 2); ctx.fill();
      }
      break;
    }

    case "glacia": { // ice shards flying outward
      const reach = d.below ? d.h : d.w;
      let ang;
      if (d.below) ang = Math.PI / 2;
      else if (d.around) ang = -Math.PI / 2;
      else ang = fc > 0 ? 0 : Math.PI;
      const ux = Math.cos(ang), uy = Math.sin(ang);
      const pr = windup ? 0.15 : ease(prog);
      for (let i = 0; i < 3; i++) {
        const dist = (12 + (reach - 12) * pr) * (0.5 + 0.27 * i);
        const off = (i - 1) * 15;
        const px = cx + ux * dist + (ux === 0 ? off : 0);
        const py = cy + uy * dist + (uy === 0 ? off * 0.8 : 0);
        const len = 14 + i * 4;
        ctx.save();
        ctx.translate(px, py); ctx.rotate(ang);
        ctx.fillStyle = inActive ? "#eef8ff" : "rgba(191,232,255,0.5)";
        ctx.beginPath();
        ctx.moveTo(len, 0); ctx.lineTo(0, 5); ctx.lineTo(-len * 0.4, 0); ctx.lineTo(0, -5);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      break;
    }

    case "wren": { // longbow: draws back on windup, snaps on release
      let ux, uy;
      if (d.arrow) { const m = Math.hypot(d.arrow.vx, d.arrow.vy) || 1; ux = fc * d.arrow.vx / m; uy = d.arrow.vy / m; }
      else if (d.around) { ux = 0; uy = -1; }        // Wind Ride: bow raised skyward
      else { ux = fc; uy = -0.2; }                   // melee swipes: held forward
      const ang = Math.atan2(uy, ux);
      const swing = d.arrow ? 0 : (windup ? -0.5 : (ease(prog) - 0.5) * 1.2) * fc; // lights sweep the bow like a club
      ctx.save();
      ctx.translate(cx + ux * (f.w/2 - 2), cy + uy * 4);
      ctx.rotate(ang + swing);
      const pull = d.arrow ? (windup ? ease(prog) * 13 : (inActive ? 0 : 2)) : 0;
      // string, bent to the nock point
      ctx.strokeStyle = inActive && d.arrow ? "#ffffff" : "rgba(255,255,255,0.55)";
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-3, -21); ctx.lineTo(-6 - pull, 0); ctx.lineTo(-3, 21); ctx.stroke();
      // limbs
      ctx.strokeStyle = "#8a6b4a"; ctx.lineWidth = 5; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(-3, -21); ctx.quadraticCurveTo(9, 0, -3, 21); ctx.stroke();
      // nocked arrow while drawing; release streak on active
      if (d.arrow && windup) {
        ctx.strokeStyle = "#c9a06a"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(-6 - pull, 0); ctx.lineTo(20 - pull, 0); ctx.stroke();
        ctx.fillStyle = "#e8edf5";
        ctx.beginPath(); ctx.moveTo(26 - pull, 0); ctx.lineTo(19 - pull, -4); ctx.lineTo(19 - pull, 4); ctx.closePath(); ctx.fill();
      } else if (d.arrow && inActive) {
        ctx.strokeStyle = "rgba(255,217,160,0.5)"; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(34, 0); ctx.stroke();
      }
      ctx.restore();
      break;
    }

    case "devourer": // the Devourer bites like the beast he is
    case "fang": { // triple claw swipe
      if (windup) { // glint at the claws
        ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = 3; ctx.lineCap = "round";
        const gx = cx + fc * (f.w/2 + 5);
        ctx.beginPath(); ctx.moveTo(gx - 3, cy - 6); ctx.lineTo(gx + 3, cy); ctx.stroke();
        break;
      }
      const baseX = d.below ? cx : cx + fc * (d.w * 0.5 + 8);
      const baseY = d.below ? cy + d.h * 0.5 : cy;
      const baseAng = d.below ? Math.PI / 2 : (fc > 0 ? -0.25 : Math.PI + 0.25);
      ctx.save();
      ctx.translate(baseX, baseY);
      ctx.rotate(baseAng + (fc > 0 ? 1 : -1) * (ease(prog) - 0.5) * 0.9);
      for (let i = 0; i < 3; i++) {
        ctx.strokeStyle = inActive ? f.char.arc : "rgba(255,255,255,0.3)";
        ctx.lineWidth = inActive ? 4 : 2.5; ctx.lineCap = "round";
        const o = (i - 1) * 11;
        ctx.beginPath();
        ctx.moveTo(-15, o - 12);
        ctx.quadraticCurveTo(12 + i * 3, o, -15, o + 12);
        ctx.stroke();
      }
      ctx.restore();
      break;
    }

    default: { // blocky: the classic arc slash
      ctx.strokeStyle = inActive ? f.char.arc : "rgba(255,255,255,0.35)";
      ctx.lineWidth = inActive ? f.char.arcWidth : 4;
      ctx.lineCap = "round";
      let a0, a1;
      if (d.around) { a0 = -Math.PI * 0.85; a1 = -Math.PI * 0.15; }
      else if (d.below) { a0 = Math.PI * 0.25; a1 = Math.PI * 0.75; }
      else if (fc > 0) { a0 = -1.4 + prog * 1.9; a1 = a0 + 0.6; }
      else { a0 = Math.PI + 1.4 - prog * 1.9; a1 = a0 - 0.6; }
      ctx.beginPath();
      ctx.arc(cx, cy, d.w * 0.85, Math.min(a0, a1), Math.max(a0, a1));
      ctx.stroke();
    }
  }
}

// ---------------- Particles & effects ----------------
let particles = [];
function burst(x, y, color, n, speed) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = (0.3 + Math.random()) * speed;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 1, life: 20 + Math.random()*20, color, r: 2 + Math.random()*3 });
  }
}
let shake = 0;
let hitstop = 0;

// ---------------- Items (bomb · boomerang · bouncy ball) ----------------
const ITEM_TYPES = ["bomb", "rang", "ball"];      // spawnable pickups
const PROJ_TYPES = [...ITEM_TYPES, "arrow"];       // everything that can be in flight (snapshot encoding)
let items = [];        // pickups on the field
let projectiles = [];  // thrown items in flight
let itemTimer = 0;
let netFx = [];        // one-frame events (explosions) relayed to online clients
let matchItems = true; // effective setting for the current match
let itemsOn = true;    // player preference (persisted)
try { itemsOn = localStorage.getItem("talhalla_items") !== "0"; } catch (e) {}
function toggleItems() {
  itemsOn = !itemsOn;
  try { localStorage.setItem("talhalla_items", itemsOn ? "1" : "0"); } catch (e) {}
  beep(itemsOn ? 620 : 300, 0.08, "square", 0.05, itemsOn ? 200 : -120);
}

function spawnItemPickup() {
  const solids = platforms.filter(p => p.solid);
  const p = solids[Math.floor(Math.random() * solids.length)];
  items.push({
    type: ITEM_TYPES[Math.floor(Math.random() * ITEM_TYPES.length)],
    x: p.x + 25 + Math.random() * (p.w - 50), y: -20, vy: 0,
    landed: false, life: 900, bob: Math.random() * 6,
  });
}

function throwItem(f) {
  const t = f.heldItem;
  f.heldItem = null;
  const up = f.input("up"), down = f.input("down") && !f.onGround;
  let vx = f.facing * (t === "rang" ? 11 : t === "ball" ? 9 : 8);
  let vy = t === "rang" ? -1 : -5;
  if (up)   { vy = -12; vx *= 0.45; }
  if (down) { vy = 9;   vx *= 0.5; }
  const uses = t === "rang" ? (f.rangUses || 0) + 1 : 0;
  if (t === "rang") f.rangUses = uses;
  projectiles.push({
    type: t, x: f.x + f.facing * 20, y: f.y - f.h * 0.6, vx, vy,
    owner: f, age: 0, life: t === "bomb" ? 130 : t === "rang" ? 380 : 360,
    phase: 0, spin: 0, hitCd: new Map(), uses,
  });
  beep(500, 0.08, "square", 0.05, -150);
}

function explode(pr) {
  burst(pr.x, pr.y, "#ff9a4d", 40, 8);
  burst(pr.x, pr.y, "#ffe680", 25, 5);
  shake = 20;
  hitstop = Math.max(hitstop, 5);
  sfx.ko();
  netFx.push(["boom", Math.round(pr.x), Math.round(pr.y)]);
  // bombs devastate story enemies too
  if (gameMode === "story") {
    for (const e of enemies) {
      if (Math.hypot(e.x - pr.x, (e.y - e.h/2) - pr.y) < 120) { e.hp -= 35; e.stun = 30; e.vx = Math.sign(e.x - pr.x) * 8; }
    }
    const b = story && story.boss;
    if (b && b.hp > 0 && Math.hypot(b.x - pr.x, (b.y - b.h/2) - pr.y) < 150) { b.hp -= 35; b.flash = 10; }
  }
  for (const f of combatants) {
    if (f.dead || f.invuln > 0 || f.dodgeT > 0) continue;
    const dx = f.x - pr.x, dy = (f.y - f.h/2) - pr.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 110) {
      f.damage = Math.min(999, f.damage + 18);
      f.superMeter = Math.min(SUPER_MAX, f.superMeter + 18);
      const kb = (11 + f.damage * 0.11) / f.char.weight;
      const nx = dist ? dx / dist : 0, ny = dist ? dy / dist : -1;
      f.vx = nx * kb;
      f.vy = Math.min(ny * kb, -kb * 0.4);
      f.onGround = false;
      f.hitstun = Math.min(40, 10 + kb);
      f.attack = null;
    }
  }
}

function projHitFighters(pr, dmg, baseKB, scale, skipFn) {
  for (const f of combatants) {
    if (f.dead || f.invuln > 0 || f.dodgeT > 0) continue;
    if (skipFn && skipFn(f)) continue;
    const cd = pr.hitCd.get(f) || 0;
    if (cd > 0) { pr.hitCd.set(f, cd - 1); continue; }
    const r = f.rect;
    if (pr.x > r.x - 6 && pr.x < r.x + r.w + 6 && pr.y > r.y - 6 && pr.y < r.y + r.h + 6) {
      f.damage = Math.min(999, f.damage + dmg);
      f.superMeter = Math.min(SUPER_MAX, f.superMeter + dmg);
      const kb = (baseKB + f.damage * scale) / f.char.weight;
      const sp = Math.hypot(pr.vx, pr.vy) || 1;
      f.vx = (pr.vx / sp) * kb;
      f.vy = Math.min(-3, (pr.vy / sp) * kb - 3);
      f.onGround = false;
      f.hitstun = Math.min(35, 8 + kb);
      shake = Math.min(14, 3 + kb * 0.4);
      burst(f.x, f.y - f.h/2, "#ffd24d", 12, 4);
      sfx.hit();
      pr.hitCd.set(f, 45);
    }
  }
}

function updateItems() {
  if (!net) netFx.length = 0;
  // pickups: parachute down, land, get collected
  for (const it of items) {
    if (!it.landed) {
      it.vy = Math.min(it.vy + 0.15, 2.2);
      it.y += it.vy;
      for (const p of platforms) {
        if (it.y >= p.y - 8 && it.y <= p.y + 12 && it.x > p.x && it.x < p.x + p.w) { it.y = p.y - 8; it.landed = true; }
      }
      if (it.y > H + 60) it.life = 0;
    } else it.life--;
    if (it.life <= 0) continue;
    for (const f of combatants) {
      if (f.dead || f.heldItem) continue;
      const r = f.rect;
      if (it.x > r.x - 10 && it.x < r.x + r.w + 10 && it.y > r.y - 10 && it.y < r.y + r.h + 10) {
        f.heldItem = it.type;
        f.rangUses = 0; // fresh boomerang, fresh uses
        it.life = 0;
        burst(it.x, it.y, "#ffe680", 10, 3);
        beep(760, 0.1, "square", 0.06, 320);
        break;
      }
    }
  }
  items = items.filter(i => i.life > 0);

  // projectiles
  for (const pr of projectiles) {
    pr.life--; pr.age++;
    pr.spin += 0.35;
    if (pr.type === "bomb") {
      pr.vy += 0.4; pr.x += pr.vx; pr.y += pr.vy;
      let boom = pr.life <= 0;
      for (const p of platforms) {
        if (p.solid && pr.x > p.x - 4 && pr.x < p.x + p.w + 4 && pr.y > p.y - 4 && pr.y < p.y + p.h) boom = true;
      }
      if (!boom && pr.age > 12) {
        for (const f of combatants) {
          if (f.dead) continue;
          const r = f.rect;
          if (pr.x > r.x - 6 && pr.x < r.x + r.w + 6 && pr.y > r.y - 6 && pr.y < r.y + r.h + 6) { boom = true; break; }
        }
      }
      if (boom) { explode(pr); pr.life = 0; }
    } else if (pr.type === "rang") {
      if (pr.phase === 0) {
        pr.vx *= 0.965;
        if (Math.abs(pr.vx) < 1.6) { pr.phase = 1; pr.hitCd.clear(); } // turn around, can hit again
      } else {
        const target = pr.owner && !pr.owner.dead ? pr.owner.x : pr.x - pr.vx * 10;
        pr.vx += Math.sign(target - pr.x) * 0.55;
        pr.vx = Math.max(-12, Math.min(12, pr.vx));
      }
      pr.x += pr.vx;
      pr.y += Math.sin(pr.spin * 0.5) * 0.4;
      if (pr.phase === 1 && pr.owner && !pr.owner.dead) { // catch it on the way back
        const r = pr.owner.rect;
        if (pr.x > r.x - 6 && pr.x < r.x + r.w + 6 && pr.y > r.y - 6 && pr.y < r.y + r.h + 6) {
          if (pr.uses >= 2) { // worn out: shatters instead of returning to hand
            burst(pr.x, pr.y, "#e8c47a", 16, 5);
            beep(220, 0.12, "square", 0.05, -120);
          } else if (!pr.owner.heldItem) {
            pr.owner.heldItem = "rang";
            pr.owner.rangUses = pr.uses;
            beep(760, 0.08, "square", 0.05, 300);
          }
          pr.life = 0;
        }
      }
      if (pr.life > 0) projHitFighters(pr, 10, 7, 0.06, f => f === pr.owner);
    } else if (pr.type === "arrow") { // arced flight, sticks where it lands
      pr.vy += 0.14; pr.x += pr.vx; pr.y += pr.vy;
      pr.spin = Math.atan2(pr.vy, pr.vx || 0.001); // nose points along the flight path
      if (pr.vx === 0 && pr.vy > 0) pr.spin = Math.PI / 2;
      for (const p of platforms) {
        if (p.solid && pr.x > p.x - 2 && pr.x < p.x + p.w + 2 && pr.y > p.y - 2 && pr.y < p.y + p.h) {
          burst(pr.x, pr.y, "#c9a06a", 6, 2.5);
          beep(260, 0.05, "square", 0.03, -80);
          pr.life = 0;
        }
      }
      if (pr.life > 0 && gameMode === "story") { // arrows skewer the horde
        for (const e of enemies) {
          if (Math.hypot(e.x - pr.x, (e.y - e.h/2) - pr.y) < 8 + Math.max(e.w, e.h) / 2) {
            e.hp -= pr.dmg + 4; e.stun = 22; e.vx = Math.sign(pr.vx || (e.x - pr.x)) * 5;
            burst(pr.x, pr.y, "#ffd9a0", 10, 4);
            sfx.hit();
            pr.life = 0;
            break;
          }
        }
        const b = story && story.boss;
        if (pr.life > 0 && b && b.hp > 0 && Math.hypot(b.x - pr.x, (b.y - b.h/2) - pr.y) < 85) {
          b.hp -= 9; b.flash = 8;
          burst(pr.x, pr.y, "#ffd9a0", 12, 4);
          sfx.hit();
          pr.life = 0;
        }
      }
      if (pr.life > 0) projHitFighters(pr, pr.dmg || 10, pr.kb || 8, 0.07, f => f === pr.owner);
    } else { // ball: bounces off solid platforms
      pr.vy += 0.45; pr.x += pr.vx; pr.y += pr.vy;
      for (const p of platforms) {
        if (!p.solid) continue;
        if (pr.x > p.x - 6 && pr.x < p.x + p.w + 6 && pr.y > p.y - 6 && pr.y < p.y + p.h + 6) {
          const dl = pr.x - (p.x - 6), dr = (p.x + p.w + 6) - pr.x;
          const dt = pr.y - (p.y - 6), db = (p.y + p.h + 6) - pr.y;
          const m = Math.min(dl, dr, dt, db);
          if (m === dt)      { pr.y = p.y - 6;        pr.vy = -Math.abs(pr.vy) * 0.85; }
          else if (m === db) { pr.y = p.y + p.h + 6;  pr.vy =  Math.abs(pr.vy) * 0.85; }
          else if (m === dl) { pr.x = p.x - 6;        pr.vx = -Math.abs(pr.vx) * 0.9; }
          else               { pr.x = p.x + p.w + 6;  pr.vx =  Math.abs(pr.vx) * 0.9; }
          beep(300, 0.05, "square", 0.03, -100);
        }
      }
      projHitFighters(pr, 12, 8, 0.08, f => pr.age < 25 && f === pr.owner); // owner briefly immune
    }
    // story levels scroll far past the normal arena, so cull at the level's edge there
    const rightEdge = (gameMode === "story" && story) ? story.levelW + 180 : BLAST.right;
    if (pr.x < BLAST.left || pr.x > rightEdge || pr.y > BLAST.bottom || pr.y < BLAST.top - 100) pr.life = 0;
  }
  projectiles = projectiles.filter(p => p.life > 0);
}

function drawItemIcon(type, x, y, s, spin) {
  ctx.save();
  ctx.translate(x, y);
  if (type === "bomb") {
    ctx.fillStyle = "#22242e";
    ctx.beginPath(); ctx.arc(0, 2 * s, 9 * s, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#8a6b4a"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(2 * s, -6 * s); ctx.quadraticCurveTo(6 * s, -13 * s, 10 * s, -11 * s); ctx.stroke();
    ctx.fillStyle = "#ffd24d";
    ctx.globalAlpha = 0.5 + 0.5 * Math.abs(Math.sin(perf * 0.02));
    ctx.beginPath(); ctx.arc(10 * s, -11 * s, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  } else if (type === "rang") {
    ctx.rotate(spin || 0);
    ctx.strokeStyle = "#e8c47a"; ctx.lineWidth = 5 * s; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-9 * s, 8 * s); ctx.lineTo(0, -8 * s); ctx.lineTo(9 * s, 8 * s); ctx.stroke();
  } else if (type === "arrow") { // spin doubles as the flight angle
    ctx.rotate(spin || 0);
    ctx.strokeStyle = "#c9a06a"; ctx.lineWidth = 3 * s; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-13 * s, 0); ctx.lineTo(8 * s, 0); ctx.stroke();
    ctx.fillStyle = "#e8edf5"; // head
    ctx.beginPath(); ctx.moveTo(15 * s, 0); ctx.lineTo(7 * s, -4 * s); ctx.lineTo(7 * s, 4 * s); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#ffd9a0"; ctx.lineWidth = 2 * s; // fletching
    ctx.beginPath();
    ctx.moveTo(-13 * s, 0); ctx.lineTo(-17 * s, -4 * s);
    ctx.moveTo(-13 * s, 0); ctx.lineTo(-17 * s, 4 * s);
    ctx.moveTo(-9 * s, 0);  ctx.lineTo(-13 * s, -4 * s);
    ctx.stroke();
  } else { // ball
    ctx.rotate(spin || 0);
    ctx.fillStyle = "#ff6b9d";
    ctx.beginPath(); ctx.arc(0, 0, 8 * s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(-8 * s, -2 * s, 16 * s, 4 * s);
  }
  ctx.restore();
}

function drawItems() {
  for (const it of items) {
    const bobY = it.landed ? Math.sin(perf * 0.004 + it.bob) * 3 : 0;
    ctx.globalAlpha = 0.22 + 0.13 * Math.sin(perf * 0.006 + it.bob);
    ctx.fillStyle = "#ffe680";
    ctx.beginPath(); ctx.arc(it.x, it.y - 8 + bobY, 17, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    if (it.landed && it.life < 120 && Math.floor(it.life / 6) % 2 === 0) continue; // despawn blink
    drawItemIcon(it.type, it.x, it.y - 8 + bobY, 1, 0);
  }
  for (const pr of projectiles) drawItemIcon(pr.type, pr.x, pr.y, 1.1, pr.spin);
  for (const f of combatants) {
    if (!f.dead && f.heldItem) drawItemIcon(f.heldItem, f.x, f.y - f.h - (gameMode === "survival" && f.isBot ? 40 : 16), 0.75, 0);
  }
}

const ENEMY_TYPES = {
  shade:  { hp: 55,  w: 36, h: 44, speed: 2.0, dmg: 11, color: "#3a3a58" },
  brute:  { hp: 150, w: 62, h: 68, speed: 1.1, dmg: 18, color: "#4a2438" },
  wisp:   { hp: 40,  w: 30, h: 30, speed: 2.2, dmg: 9,  color: "#9bd8ff", flying: true },
  spiker: { hp: 90,  w: 42, h: 38, speed: 0,   dmg: 10, color: "#6a5a2a", shooter: true },
};

function spawnEnemy(t, x, y) {
  const d = ENEMY_TYPES[t];
  enemies.push({ t, x, y: y || 0, baseY: y || 300, vx: 0, vy: 0, hp: d.hp, maxHp: d.hp,
                 w: d.w, h: d.h, stun: 0, cd: 60 + Math.random() * 60, wob: Math.random() * 6, dir: -1 });
}

function startStoryLevel(ch) {
  const L = STORY_LEVELS[ch];
  currentMap = MAPS.find(m => m.key === L.map) || MAPS[0];
  platforms = L.platforms;
  gameMode = "story";
  story = { chapter: ch, levelW: L.width, spawnX: 90, goal: L.goal, boss: null, clearT: 0 };
  enemies = []; enemyProjs = [];
  for (const e of L.enemies) spawnEnemy(e[0], e[1], e[2]);
  if (L.boss) {
    const mult = 1 + (partyRoster.length - 1) * 0.6;
    story.boss = { x: 1000, y: 600, vx: 0, vy: 0, w: 150, h: 170, hp: Math.round(750 * mult), maxHp: Math.round(750 * mult),
                   facing: -1, timer: 120, action: "idle", actT: 0, flash: 0, phase: 1 };
  }
  combatants = [];
  partyRoster.forEach((idx, k) => {
    const f = fighters[idx];
    f.isBot = false;
    f.spawnX = 80 + k * 46;
    f.spawnFacing = 1;
    f.resetMatch();
    combatants.push(f);
  });
  camX = 0;
  particles = []; shake = 0; hitstop = 0;
  items = []; projectiles = []; itemTimer = 0; netFx = [];
  matchItems = itemsOn;
  winner = null; gameOver = null;
  banner = { text: "CHAPTER " + (ch + 1) + ":  " + L.name + "  —  " + L.intro, t: 260 };
  state = "playing";
}

function storyPlayerHit(f, dmg, fromX) {
  if (f.dead || f.invuln > 0 || f.dodgeT > 0) return false;
  f.damage = Math.min(999, f.damage + dmg);
  f.superMeter = Math.min(300, f.superMeter + dmg);
  if (f.damage >= 220) { // battered beyond the limit: this hit takes the stock
    burst(f.x, f.y - f.h/2, f.color, 30, 7);
    sfx.ko();
    f.ko();
    return true;
  }
  const kb = (6.5 + f.damage * 0.05) / f.char.weight;
  f.vx = Math.sign(f.x - fromX || 1) * kb;
  f.vy = -kb * 0.6;
  f.onGround = false;
  f.hitstun = Math.min(30, 10 + kb * 0.5);
  f.invuln = 45; // contact mercy window
  burst(f.x, f.y - f.h/2, "#ffd24d", 10, 3);
  sfx.hit();
  shake = Math.min(12, 4 + kb * 0.4);
  return true;
}

function nearestPlayer(x) {
  let best = null, bd = Infinity;
  for (const f of combatants) {
    if (f.dead) continue;
    const d = Math.abs(f.x - x);
    if (d < bd) { bd = d; best = f; }
  }
  return best;
}

function updateEnemies() {
  for (const e of enemies) {
    const d = ENEMY_TYPES[e.t];
    if (e.stun > 0) e.stun--;
    const tgt = nearestPlayer(e.x);
    if (d.flying) { // wisp: hover-chase
      if (tgt && Math.abs(tgt.x - e.x) < 620 && e.stun <= 0) {
        e.x += Math.sign(tgt.x - e.x) * d.speed;
        e.baseY += Math.sign((tgt.y - tgt.h/2) - e.baseY) * 1.1;
      }
      e.baseY = Math.max(140, Math.min(560, e.baseY));
      e.x += e.vx; e.vx *= 0.9;
      e.y = e.baseY + Math.sin(perf * 0.004 + e.wob) * 14;
    } else if (d.shooter) { // spiker: sit & shoot
      e.vy += 0.5; e.y += e.vy;
      for (const p of platforms) if (e.vy >= 0 && e.y >= p.y && e.y <= p.y + 20 && e.x > p.x && e.x < p.x + p.w) { e.y = p.y; e.vy = 0; }
      e.cd--;
      if (e.cd <= 0 && tgt && Math.abs(tgt.x - e.x) < 560 && e.stun <= 0) {
        const dx = tgt.x - e.x, dy = (tgt.y - tgt.h/2) - (e.y - e.h/2);
        const m = Math.hypot(dx, dy) || 1;
        enemyProjs.push({ kind: "spike", x: e.x, y: e.y - e.h/2, vx: dx/m * 4.2, vy: dy/m * 4.2, life: 180, spin: 0 });
        e.cd = 110 + Math.random() * 50;
        beep(260, 0.08, "square", 0.05, -80);
      }
    } else { // shade / brute: walk & bite
      e.vy += 0.5;
      e.x += e.vx; e.vx *= 0.85;
      if (tgt && Math.abs(tgt.x - e.x) < 620 && e.stun <= 0) {
        e.x += Math.sign(tgt.x - e.x) * d.speed;
        e.dir = Math.sign(tgt.x - e.x) || e.dir;
      }
      e.y += e.vy;
      for (const p of platforms) {
        if (e.vy >= 0 && e.y >= p.y && e.y - e.vy <= p.y + 4 && e.x > p.x - 10 && e.x < p.x + p.w + 10) { e.y = p.y; e.vy = 0; }
      }
      if (e.y > H + 220) e.hp = 0; // fell into a pit
    }
    // contact damage
    if (e.stun <= 0) {
      for (const f of combatants) {
        const r = f.rect;
        if (e.x + e.w/2 > r.x && e.x - e.w/2 < r.x + r.w && e.y > r.y && e.y - e.h < r.y + r.h) {
          storyPlayerHit(f, d.dmg, e.x);
        }
      }
    }
  }
  enemies = enemies.filter(e => e.hp > 0);

  // enemy projectiles
  for (const pr of enemyProjs) {
    pr.life--; pr.spin += 0.3;
    if (pr.kind === "orb") pr.vy += 0.12;
    if (pr.kind === "wave") { pr.vy += 0.6; }
    pr.x += pr.vx; pr.y += pr.vy;
    if (pr.kind === "wave") for (const p of platforms) if (pr.y >= p.y && pr.x > p.x && pr.x < p.x + p.w) { pr.y = p.y; pr.vy = 0; }
    for (const f of combatants) {
      const r = f.rect;
      if (pr.x > r.x - 6 && pr.x < r.x + r.w + 6 && pr.y > r.y - 6 && pr.y < r.y + r.h + 6) {
        if (storyPlayerHit(f, pr.kind === "wave" ? 16 : pr.kind === "orb" ? 14 : 10, pr.x - pr.vx * 10)) pr.life = 0;
      }
    }
    if (pr.kind === "spike") for (const p of platforms) if (p.solid && pr.x > p.x && pr.x < p.x + p.w && pr.y > p.y && pr.y < p.y + p.h) pr.life = 0;
  }
  enemyProjs = enemyProjs.filter(p => p.life > 0);
}

function updateBoss() {
  const b = story.boss;
  if (!b || b.hp <= 0) return;
  if (b.flash > 0) b.flash--;
  const tgt = nearestPlayer(b.x);
  if (b.hp < b.maxHp / 2 && b.phase === 1) {
    b.phase = 2;
    banner = { text: "TALHALLA IS ENRAGED!", t: 120 };
    burst(b.x, b.y - b.h/2, "#ff5a3c", 50, 8);
  }
  b.vy += 0.55; b.y += b.vy;
  if (b.y >= 600) { b.y = 600; b.vy = 0; }
  if (b.action === "idle") {
    if (tgt) { b.facing = Math.sign(tgt.x - b.x) || b.facing; b.x += b.facing * (b.phase === 2 ? 1.4 : 0.9); }
    b.timer--;
    if (b.timer <= 0 && tgt) {
      const dist = Math.abs(tgt.x - b.x);
      const roll = Math.random();
      if (enemies.length < (b.phase === 2 ? 4 : 2) && roll < 0.25) b.action = "summon";
      else if (dist > 380 || roll < 0.5) b.action = "spit";
      else if (roll < 0.78) b.action = "slam";
      else b.action = "charge";
      b.actT = 0;
    }
  } else {
    b.actT++;
    if (b.action === "slam") {
      if (b.actT === 30) { // shockwaves both ways along the ground
        shake = 18; sfx.heavy();
        for (const dir of [-1, 1]) enemyProjs.push({ kind: "wave", x: b.x + dir * b.w/2, y: 600, vx: dir * 5.5, vy: 0, life: 110, spin: 0 });
        burst(b.x, b.y, "#ffb14d", 30, 7);
      }
      if (b.actT > 55) { b.action = "idle"; b.timer = b.phase === 2 ? 70 : 110; }
    } else if (b.action === "spit") {
      if (b.actT === 25) {
        const shots = b.phase === 2 ? 5 : 3;
        for (let i = 0; i < shots; i++) {
          const t2 = nearestPlayer(b.x);
          const dx = (t2 ? t2.x : b.x - 300) - b.x, dy = ((t2 ? t2.y - 40 : 500)) - (b.y - b.h * 0.7);
          const m = Math.hypot(dx, dy) || 1;
          const sp = 5 + i * 0.6;
          enemyProjs.push({ kind: "orb", x: b.x - b.facing * -10, y: b.y - b.h * 0.7, vx: dx/m * sp + (i - shots/2) * 0.8, vy: dy/m * sp - 2, life: 170, spin: 0 });
        }
        beep(180, 0.2, "sawtooth", 0.1, -60);
      }
      if (b.actT > 45) { b.action = "idle"; b.timer = b.phase === 2 ? 60 : 100; }
    } else if (b.action === "summon") {
      if (b.actT === 30) {
        spawnEnemy("shade", b.x - 120, 0);
        spawnEnemy(b.phase === 2 ? "wisp" : "shade", b.x + 120, 300);
        burst(b.x, b.y - b.h/2, "#b06bff", 24, 5);
        beep(140, 0.3, "sawtooth", 0.09, 80);
      }
      if (b.actT > 50) { b.action = "idle"; b.timer = 120; }
    } else if (b.action === "charge") {
      if (b.actT < 20) { /* crouch telegraph */ }
      else if (b.actT < 60) b.x += b.facing * (b.phase === 2 ? 10 : 8);
      else { b.action = "idle"; b.timer = b.phase === 2 ? 60 : 100; }
    }
  }
  b.x = Math.max(b.w/2, Math.min(story.levelW - b.w/2, b.x));
  // contact damage
  for (const f of combatants) {
    const r = f.rect;
    if (b.x + b.w/2 - 14 > r.x && b.x - b.w/2 + 14 < r.x + r.w && b.y > r.y && b.y - b.h < r.y + r.h) {
      storyPlayerHit(f, b.action === "charge" ? 20 : 14, b.x);
    }
  }
}

function updateStory() {
  // player attacks vs enemies & boss
  for (const atkP of combatants) {
    if (!atkP.attack) continue;
    const hb = atkP.hitbox();
    if (!hb) continue;
    for (const e of enemies) {
      if (e.hp <= 0 || atkP.attack.hitSet.has(e)) continue;
      if (rectsOverlap(hb, { x: e.x - e.w/2, y: e.y - e.h, w: e.w, h: e.h })) {
        atkP.attack.hitSet.add(e);
        e.hp -= atkP.attack.def.dmg;
        e.vx = atkP.facing * 7; e.vy = -3; e.stun = 22;
        burst(e.x, e.y - e.h/2, "#ffd24d", 10, 3);
        sfx.hit(); hitstop = Math.max(hitstop, 2);
        if (e.hp <= 0) { burst(e.x, e.y - e.h/2, ENEMY_TYPES[e.t].color, 26, 6); sfx.ko(); }
      }
    }
    const b = story.boss;
    if (b && b.hp > 0 && !atkP.attack.hitSet.has(b)) {
      if (rectsOverlap(hb, { x: b.x - b.w/2, y: b.y - b.h, w: b.w, h: b.h })) {
        atkP.attack.hitSet.add(b);
        b.hp -= atkP.attack.def.dmg;
        b.flash = 8;
        burst(atkP.x + atkP.facing * 40, atkP.y - atkP.h/2, "#ffd24d", 10, 4);
        sfx.hit(); hitstop = Math.max(hitstop, 2);
      }
    }
  }
  // bombs hurt the horde too
  for (const e of enemies) {
    // (explosions handled via explode() below-radius check on combatants only; give enemies splash here)
  }

  updateEnemies();
  updateBoss();

  // camera follows the team
  const living = combatants.filter(f => !f.dead);
  if (living.length) {
    const avg = living.reduce((s, f) => s + f.x, 0) / living.length;
    const target = Math.max(0, Math.min(story.levelW - W, avg - W/2));
    camX += (target - camX) * 0.08;
  }

  // goal portal
  if (story.goal && story.clearT === 0) {
    for (const f of combatants) {
      if (!f.dead && Math.abs(f.x - story.goal.x) < 44 && Math.abs(f.y - story.goal.y) < 90) {
        story.clearT = 1;
        banner = { text: "CHAPTER CLEAR!", t: 150 };
        setStoryUnlocked(story.chapter + 2);
        sfx.ko(); burst(story.goal.x, story.goal.y - 40, "#ffe680", 40, 6);
        break;
      }
    }
  }
  if (story.clearT > 0) {
    story.clearT++;
    // victory fireworks after slaying the boss
    if (story.bossDead && story.clearT % 12 === 0) {
      burst(150 + Math.random() * 980, 120 + Math.random() * 320,
            ["#ffe680", "#ff8a5c", "#7dffa0", "#7df0ff"][Math.floor(Math.random() * 4)], 32, 7);
      sfx.jump();
    }
    if (story.clearT > (story.bossDead ? 260 : 130)) {
      if (story.chapter + 1 < STORY_LEVELS.length) {
        if (net && net.role === "host") netStartStory(story.chapter + 1);
        else startStoryLevel(story.chapter + 1);
      }
      else { gameOver = { title: "STORY COMPLETE!", sub: "The realm is saved — TALHALLA is now PLAYABLE!", color: "#ffe680" }; state = "gameover"; menuKeyLatch = {}; }
    }
    return;
  }

  // boss defeated?
  if (story.boss && story.boss.hp <= 0 && !story.bossDead) {
    story.bossDead = true;
    burst(story.boss.x, story.boss.y - story.boss.h/2, "#ff5a3c", 80, 10);
    burst(story.boss.x, story.boss.y - story.boss.h/2, "#ffe680", 50, 7);
    shake = 24; sfx.ko();
    setStoryUnlocked(STORY_LEVELS.length + 1);
    story.clearT = 1;
    banner = { text: "TALHALLA HAS FALLEN!", t: 150 };
  }

  // team wiped?
  if (combatants.every(f => f.dead)) {
    gameOver = { title: "CHAPTER FAILED", sub: "ENTER — retry  ·  ESC — menu", color: "#ff6b4d", retry: true };
    state = "gameover"; menuKeyLatch = {};
  }
}

function drawEnemies() {
  for (const e of enemies) {
    const d = ENEMY_TYPES[e.t];
    const ex = e.x, ey = e.y;
    ctx.save();
    if (e.stun > 0 && Math.floor(e.stun / 3) % 2 === 0) ctx.globalAlpha = 0.6;
    if (e.t === "wisp") {
      const flap = Math.sin(perf * 0.02 + e.wob) * 8;
      ctx.fillStyle = "rgba(155,216,255,0.25)";
      ctx.beginPath(); ctx.arc(ex, ey - 15, 20, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = d.color;
      ctx.beginPath(); ctx.arc(ex, ey - 15, 12, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "rgba(220,240,255,0.8)"; ctx.lineWidth = 3; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(ex - 10, ey - 18); ctx.quadraticCurveTo(ex - 24, ey - 24 + flap, ex - 30, ey - 14 + flap); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ex + 10, ey - 18); ctx.quadraticCurveTo(ex + 24, ey - 24 + flap, ex + 30, ey - 14 + flap); ctx.stroke();
      ctx.fillStyle = "#0b0e1a";
      ctx.fillRect(ex - 5, ey - 19, 3, 5); ctx.fillRect(ex + 2, ey - 19, 3, 5);
    } else if (e.t === "spiker") {
      ctx.fillStyle = "#4a4020";
      for (let i = 0; i < 8; i++) {
        const a = i * Math.PI / 4 + Math.sin(perf * 0.002) * 0.1;
        ctx.beginPath();
        ctx.moveTo(ex + Math.cos(a) * 14, ey - 18 + Math.sin(a) * 14);
        ctx.lineTo(ex + Math.cos(a) * 26, ey - 18 + Math.sin(a) * 26);
        ctx.lineTo(ex + Math.cos(a + 0.35) * 14, ey - 18 + Math.sin(a + 0.35) * 14);
        ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = d.color;
      ctx.beginPath(); ctx.arc(ex, ey - 18, 15, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ffd24d";
      ctx.beginPath(); ctx.arc(ex, ey - 18, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#0b0e1a";
      ctx.beginPath(); ctx.arc(ex + 1, ey - 18, 2.4, 0, Math.PI * 2); ctx.fill();
    } else { // shade / brute
      const bob = Math.sin(perf * 0.006 + e.wob) * 2;
      ctx.fillStyle = d.color;
      ctx.beginPath();
      ctx.moveTo(ex - e.w/2, ey);
      ctx.quadraticCurveTo(ex - e.w/2 - 4, ey - e.h + bob, ex, ey - e.h + bob);
      ctx.quadraticCurveTo(ex + e.w/2 + 4, ey - e.h + bob, ex + e.w/2, ey);
      // wispy fringe bottom
      for (let k = 2; k >= -2; k--) ctx.lineTo(ex + k * e.w/5, ey - (k % 2 ? 8 : 0));
      ctx.closePath(); ctx.fill();
      if (e.t === "brute") { // horns
        ctx.beginPath(); ctx.moveTo(ex - 18, ey - e.h + 8); ctx.lineTo(ex - 30, ey - e.h - 16); ctx.lineTo(ex - 8, ey - e.h + 2); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(ex + 18, ey - e.h + 8); ctx.lineTo(ex + 30, ey - e.h - 16); ctx.lineTo(ex + 8, ey - e.h + 2); ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = e.t === "brute" ? "#ff6b4d" : "#a0e8ff";
      const eyeY = ey - e.h * 0.68 + bob;
      ctx.fillRect(ex + e.dir * 4 - 5, eyeY, 4, 6);
      ctx.fillRect(ex + e.dir * 12 - 2, eyeY, 4, 6);
    }
    ctx.restore();
    // mini hp bar
    if (e.hp < e.maxHp) {
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.fillRect(ex - 20, e.y - e.h - 12, 40, 5);
      ctx.fillStyle = "#7dffa0";
      ctx.fillRect(ex - 20, e.y - e.h - 12, 40 * Math.max(0, e.hp / e.maxHp), 5);
    }
  }
  // enemy projectiles
  for (const pr of enemyProjs) {
    if (pr.kind === "spike") {
      ctx.save(); ctx.translate(pr.x, pr.y); ctx.rotate(pr.spin);
      ctx.fillStyle = "#c8b060";
      ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(-6, -5); ctx.lineTo(-6, 5); ctx.closePath(); ctx.fill();
      ctx.restore();
    } else if (pr.kind === "orb") {
      ctx.fillStyle = "rgba(255,90,60,0.35)";
      ctx.beginPath(); ctx.arc(pr.x, pr.y, 12, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ff7a4d";
      ctx.beginPath(); ctx.arc(pr.x, pr.y, 7, 0, Math.PI * 2); ctx.fill();
    } else { // wave
      ctx.fillStyle = "rgba(255,177,77,0.8)";
      for (let k = 0; k < 3; k++) {
        const hgt = 18 - k * 4 + Math.sin(perf * 0.03 + k) * 3;
        ctx.fillRect(pr.x - 8 + k * 6 * Math.sign(pr.vx), pr.y - hgt, 5, hgt);
      }
    }
  }
}
