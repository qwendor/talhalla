    if (chIdx >= 0) {
      const def = CHARACTERS[chIdx];
      drawFighterPreview(def, cx + cardW/2, cy + 112, 1.0, fighters[s].color, fighters[s].colorDark);
      ctx.fillStyle = fighters[s].color;
      ctx.font = "bold 16px 'Segoe UI', Arial"; ctx.textAlign = "center";
      ctx.fillText("P" + (s + 1) + (s === 0 ? " · HOST" : ""), cx + cardW/2, cy + 138);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 21px 'Segoe UI', Arial";
      ctx.fillText(def.name, cx + cardW/2, cy + 165);
      // stat bars under the fighter
      const bars = [["SPD", def.statsBar.spd], ["PWR", def.statsBar.pwr], ["WGT", def.statsBar.wgt]];
      for (let b = 0; b < 3; b++) {
        const by = cy + 192 + b * 19;
        ctx.fillStyle = "rgba(255,255,255,0.55)";
        ctx.font = "11px Consolas, monospace"; ctx.textAlign = "left";
        ctx.fillText(bars[b][0], cx + 22, by);
        ctx.fillStyle = "rgba(255,255,255,0.15)";
        ctx.fillRect(cx + 58, by - 6, cardW - 80, 9);
        ctx.fillStyle = "#ffe680";
        ctx.fillRect(cx + 58, by - 6, (cardW - 80) * bars[b][1], 9);
      }
      ctx.textAlign = "center";
      ctx.fillStyle = L && L.ready[s] ? "#7dffa0" : "rgba(255,255,255,0.5)";
      ctx.font = "bold 16px 'Segoe UI', Arial";
      ctx.fillText(L && L.ready[s] ? "✓ READY" : "choosing…", cx + cardW/2, cy + 272);
    } else {
      ctx.fillStyle = "rgba(255,255,255,0.35)";
      ctx.font = "17px 'Segoe UI', Arial";
      ctx.fillText("OPEN", cx + cardW/2, cy + 130);
      ctx.fillText("waiting for a friend…", cx + cardW/2, cy + 160);
    }
  }

  // mode line (host cycles with W/S)
  const lm = net && net.lobby ? (net.lobby.mode || 0) : 0;
  ctx.font = "bold 19px 'Segoe UI', Arial";
  ctx.fillStyle = lm > 0 ? "#ff8a5c" : "#7df0ff";
  ctx.fillText("MODE:  " + (lm > 0 ? "STORY CO-OP — CH." + lm + " " + STORY_LEVELS[lm - 1].name : "VERSUS — free for all")
    + (net && net.role === "host" ? "   (W/S change)" : ""), W/2, cy + cardH + 16);

  ctx.font = "17px 'Segoe UI', Arial";
  if (net && net.err) {
    ctx.fillStyle = "#ff6b6b";
    ctx.fillText("⚠ " + net.err, W/2, cy + cardH + 40);
  } else if (net && net.hostPicking) {
    ctx.fillStyle = "#ffe680";
    ctx.fillText("Host is choosing the map…", W/2, cy + cardH + 40);
  } else if (net && net.role === "host") {
    ctx.fillStyle = net.lobby && lobbyReady() ? "#7dffa0" : "rgba(255,255,255,0.6)";
    ctx.fillText(net.lobby && lobbyReady() ? "All ready! Press ENTER to choose the map" : "Waiting for everyone to ready up (need 2+ players)…", W/2, cy + cardH + 40);
  } else {
    ctx.fillStyle = "rgba(255,255,255,0.6)";
    ctx.fillText("The host starts the match once everyone is ready", W/2, cy + cardH + 40);
  }

  ctx.fillStyle = "rgba(255,255,255,0.5)";
  ctx.font = "16px 'Segoe UI', Arial";
  ctx.fillText("A / D (or ←/→, stick) pick fighter · F (or Ⓧ) ready/unready · ESC leave room", W/2, H - 30);
}

function drawMapSelect() {
  drawBackground(MAPS[mapSel.idx]);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#ffe680";
  ctx.font = "bold 52px 'Segoe UI', Arial";
  ctx.fillText("CHOOSE THE BATTLEFIELD", W/2, 70);

  const cols = 3, cardW = 340, cardH = 230, gapX = 40, gapY = 26;
  const x0 = W/2 - (cols * cardW + (cols - 1) * gapX) / 2;
  const y0 = 120;

  for (let m = 0; m < MAPS.length; m++) {
    const map = MAPS[m];
    const cx = x0 + (m % cols) * (cardW + gapX);
    const cy = y0 + Math.floor(m / cols) * (cardH + gapY);
    ctx.fillStyle = "rgba(10,14,30,0.85)";
    roundRect(cx, cy, cardW, cardH, 16); ctx.fill();
    if (m === mapSel.idx) {
      ctx.lineWidth = 5; ctx.strokeStyle = "#ffe680";
      roundRect(cx - 5, cy - 5, cardW + 10, cardH + 10, 20); ctx.stroke();
    }

    // mini stage preview
    const px = cx + 16, py = cy + 14, pw = cardW - 32, ph = 130;
    const g = ctx.createLinearGradient(0, py, 0, py + ph);
    g.addColorStop(0, map.sky[0]); g.addColorStop(1, map.sky[2]);
    ctx.fillStyle = g;
    roundRect(px, py, pw, ph, 8); ctx.fill();
    // hint of the map's theme color along the preview bottom
    const tg = ctx.createLinearGradient(0, py + ph - 30, 0, py + ph);
    tg.addColorStop(0, "rgba(0,0,0,0)");
    tg.addColorStop(1, map.themeColor + "44");
    ctx.fillStyle = tg;
    roundRect(px, py, pw, ph, 8); ctx.fill();
    const sx = pw / W, sy = ph / H;
    for (const p of map.platforms) {
      ctx.fillStyle = p.solid ? map.rockTop : "rgba(255,255,255,0.55)";
      ctx.fillRect(px + p.x * sx, py + p.y * sy, p.w * sx, Math.max(3, p.h * sy * 0.6));
    }

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 20px 'Segoe UI', Arial"; ctx.textAlign = "center";
    ctx.fillText(map.name, cx + cardW/2, cy + 168);
    ctx.fillStyle = "rgba(255,255,255,0.6)";
    ctx.font = "13px 'Segoe UI', Arial";
    ctx.fillText(map.desc, cx + cardW/2, cy + 195);
  }

  ctx.fillStyle = itemsOn ? "#7dffa0" : "rgba(255,150,150,0.8)";
  ctx.font = "bold 15px 'Segoe UI', Arial";
  ctx.fillText("ITEMS: " + (itemsOn ? "ON" : "OFF") + "  ·  press T to toggle", W/2, H - 46);
  ctx.fillStyle = "rgba(255,255,255,0.5)";
  ctx.font = "16px 'Segoe UI', Arial";
  ctx.fillText("Choose: A/D + S/row · ←/→ · stick     Fight: F / , / Ⓐ / ENTER     Fighters: G / .     Menu: ESC", W/2, H - 22);
}

function drawGameOver() {
  ctx.fillStyle = "rgba(5,8,20,0.75)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = gameOver.color;
  ctx.font = "bold 72px 'Segoe UI', Arial";
  ctx.fillText(gameOver.title, W/2, H/2 - 60);
  if (gameOver.sub) {
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.font = "26px 'Segoe UI', Arial";
    ctx.fillText(gameOver.sub, W/2, H/2 + 8);
  }
  ctx.fillStyle = "rgba(255,255,255,0.7)";
  ctx.font = "24px 'Segoe UI', Arial";
  ctx.fillText("ENTER — back to menu", W/2, H/2 + 70);
}

let perf = 0;
function draw() {
  perf = performance.now();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);

  if (state === "menu") { drawMenu(); return; }
  if (state === "storyselect") { drawStorySelect(); drawHomeButton(); return; }
  if (state === "online") { drawOnlineMenu(); drawHomeButton(); return; }
  if (state === "joincode") { drawJoinCode(); drawHomeButton(); return; }
  if (state === "lobby") { drawLobby(); drawHomeButton(); return; }
  if (state === "charselect") { drawCharSelect(); drawHomeButton(); return; }
  if (state === "mapselect") { drawMapSelect(); drawHomeButton(); return; }

  // screen shake
  const sx = (Math.random() - 0.5) * shake;
  const sy = (Math.random() - 0.5) * shake;
  ctx.setTransform(1, 0, 0, 1, sx, sy);

  drawBackground(); // backdrop stays put; the world scrolls in story mode
  const cam = gameMode === "story" ? camX : 0;
  ctx.setTransform(1, 0, 0, 1, sx - cam, sy);
  drawStage();
  if (gameMode === "story" && story) { drawGoalPortal(); drawEnemies(); drawBoss(); }
  drawItems();
  for (const f of combatants) f.draw();
  // super meter bar under every fighter
  if (state === "playing" || state === "gameover") {
    for (const f of combatants) {
      if (f.dead) continue;
      const mw = 46, mx = f.x - mw/2, my = f.y + 10;
      ctx.fillStyle = "rgba(0,0,0,0.45)";
      ctx.fillRect(mx, my, mw, 5);
      const frac = f.superMeter / SUPER_MAX;
      ctx.fillStyle = frac >= 1 ? (Math.floor(perf / 120) % 2 ? "#ffffff" : "#ffe680") : "#ffb14d";
      ctx.fillRect(mx, my, mw * Math.min(1, frac), 5);
      if (frac >= 1) {
        ctx.fillStyle = "#ffe680";
        ctx.font = "bold 10px 'Segoe UI', Arial";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("SPECIAL READY!", f.x, my + 14);
      }
    }
  }
  // survival: damage bubbles above each bot's head
  if (gameMode === "survival" && state === "playing") {
    for (const f of combatants) {
      if (!f.isBot || f.dead) continue;
      ctx.beginPath(); ctx.arc(f.x, f.y - f.h - 18, 13, 0, Math.PI * 2);
      ctx.fillStyle = damageColor(f.damage); ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = f.color; ctx.stroke();
      ctx.fillStyle = "#1a1a2e";
      ctx.font = "bold 12px 'Segoe UI', Arial";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(Math.round(f.damage), f.x, f.y - f.h - 17);
    }
  }
  for (const p of particles) {
    ctx.globalAlpha = Math.min(1, p.life / 15);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (const f of combatants) drawOffscreenArrow(f, cam);
  drawHUD();

  // floating announcement (arcade stages, survival spawns)
  if (banner && banner.t > 0 && state === "playing") {
    ctx.globalAlpha = Math.min(1, banner.t / 40);
    ctx.fillStyle = "#ffe680";
    ctx.font = "bold 30px 'Segoe UI', Arial";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(banner.text, W/2, 170);
    ctx.globalAlpha = 1;
  }

  // special-move cutscene overlay
  if (cutscene && state === "playing") {
    const cf = cutscene.f;
    const p = Math.min(1, cutscene.t / 15);
    const fade = cutscene.t > cutscene.total ? Math.min(1, (cutscene.t - cutscene.total) / 15) : 0;
    ctx.fillStyle = "rgba(5,8,20," + (0.55 * p * (1 - fade)) + ")";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "rgba(0,0,0," + (0.92 * p * (1 - fade)) + ")";
    ctx.fillRect(0, 0, W, 92 * p);
    ctx.fillRect(0, H - 92 * p, W, 92 * p);
    // speed lines
    ctx.strokeStyle = "rgba(255,255,255," + (0.12 * (1 - fade)) + ")";
    ctx.lineWidth = 2;
    for (let i = 0; i < 14; i++) {
      const ly = 100 + (i * 137) % (H - 200);
      const lx = ((perf * 2.2 + i * 300) % (W + 600)) - 300;
      ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx - 190, ly); ctx.stroke();
    }
    ctx.globalAlpha = 1 - fade;
    drawFighterPreview(cf.char, W/2 - 270, H/2 + 160, 3.4, cf.color, cf.colorDark);
    const tx = W/2 - 40 + (1 - p) * 320;
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffe680";
    ctx.font = "bold 52px 'Segoe UI', Arial";
    ctx.fillText(SPECIAL_NAMES[cf.char.key] || "SPECIAL", tx, H/2 - 22);
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.font = "24px 'Segoe UI', Arial";
    ctx.fillText((cutscene.label || cf.name) + "  unleashes their special!", tx, H/2 + 30);
    ctx.globalAlpha = 1;
    // impact flash at the moment it lands
    const d = Math.abs(cutscene.t - cutscene.total);
    if (d < 6) {
      ctx.fillStyle = "rgba(255,255,255," + (1 - d / 6) + ")";
      ctx.fillRect(0, 0, W, H);
    }
    ctx.textAlign = "center";
  }

  if (state === "gameover") drawGameOver();
  drawHomeButton();
}

// ---------------- Main loop (fixed 60fps step) ----------------
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function loop(now) {
  acc += Math.min(100, now - last);
  last = now;
  while (acc >= STEP) { update(); acc -= STEP; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// dev/testing hook: lets automation step the simulation deterministically
window.__talhalla = {
  step(n) { for (let i = 0; i < (n || 1); i++) update(); draw(); },
  get state() { return state; },
  get sel() { return sel; },
  get combatants() { return combatants; },
  get surv() { return surv; },
  get music() { return music; },
  get gameMode() { return gameMode; },
  get menuIndex() { return menuIndex; },
  get net() { return net; },
  get items() { return items; },
  get projectiles() { return projectiles; },
  get itemsOn() { return itemsOn; },
  get matchItems() { return matchItems; },
  get story() { return story; },
  get enemies() { return enemies; },
  get camX() { return camX; },
  netInitMatch, applySnapshot, buildSnapshot,
  fighters, CHARACTERS,
};
</script>
</body>
