function charLocked(i) {
  return !!(CHARACTERS[i] && CHARACTERS[i].locked) && getStoryUnlocked() <= STORY_LEVELS.length;
}
function drawBoss() {
  const b = story.boss;
  if (!b || b.hp <= 0) return;
  const bx = b.x, by = b.y;
  ctx.save();
  if (b.flash > 0) { ctx.globalAlpha = 0.75; }
  if (bossImg && bossImg.complete) {
    ctx.save();
    if (b.facing > 0) { ctx.translate(bx, 0); ctx.scale(-1, 1); ctx.translate(-bx, 0); }
    ctx.drawImage(bossImg, bx - b.w/2 - 15, by - b.h - 10, b.w + 30, b.h + 10);
    ctx.restore();
  } else {
    const crouch = b.action === "charge" && b.actT < 20 ? 14 : 0;
    // body
    ctx.fillStyle = b.flash > 0 ? "#ffffff" : "#3d1428";
    ctx.beginPath();
    ctx.moveTo(bx - b.w/2, by);
    ctx.quadraticCurveTo(bx - b.w/2 - 20, by - b.h + crouch, bx, by - b.h + crouch);
    ctx.quadraticCurveTo(bx + b.w/2 + 20, by - b.h + crouch, bx + b.w/2, by);
    ctx.closePath(); ctx.fill();
    // horns
    ctx.fillStyle = "#5a2440";
    ctx.beginPath(); ctx.moveTo(bx - 40, by - b.h + 18); ctx.lineTo(bx - 78, by - b.h - 42); ctx.lineTo(bx - 16, by - b.h + 6); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(bx + 40, by - b.h + 18); ctx.lineTo(bx + 78, by - b.h - 42); ctx.lineTo(bx + 16, by - b.h + 6); ctx.closePath(); ctx.fill();
    // eyes (glow harder in phase 2)
    ctx.fillStyle = b.phase === 2 ? "#ff3c2a" : "#ff8a5c";
    ctx.globalAlpha = 0.9;
    ctx.fillRect(bx + b.facing * 18 - 10, by - b.h * 0.72, 12, 10);
    ctx.fillRect(bx + b.facing * 44 - 8, by - b.h * 0.72, 10, 9);
    ctx.globalAlpha = 1;
    // maw
    ctx.fillStyle = "#1a0812";
    ctx.beginPath();
    ctx.moveTo(bx + b.facing * 20 - 26, by - b.h * 0.4);
    ctx.quadraticCurveTo(bx + b.facing * 30, by - b.h * 0.28 + Math.sin(perf * 0.008) * 4, bx + b.facing * 20 + 26, by - b.h * 0.4);
    ctx.quadraticCurveTo(bx + b.facing * 20, by - b.h * 0.18, bx + b.facing * 20 - 26, by - b.h * 0.4);
    ctx.fill();
    ctx.fillStyle = "#ffffff"; // teeth
    for (let k = -2; k <= 2; k++) {
      ctx.beginPath();
      ctx.moveTo(bx + b.facing * 20 + k * 9 - 3, by - b.h * 0.395);
      ctx.lineTo(bx + b.facing * 20 + k * 9, by - b.h * 0.33);
      ctx.lineTo(bx + b.facing * 20 + k * 9 + 3, by - b.h * 0.395);
      ctx.closePath(); ctx.fill();
    }
    // claws
    ctx.fillStyle = "#5a2440";
    ctx.beginPath(); ctx.arc(bx - b.w/2 + 6, by - 16, 16, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(bx + b.w/2 - 6, by - 16, 16, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawGoalPortal() {
  if (!story || !story.goal) return;
  const gx = story.goal.x, gy = story.goal.y - 55;
  for (let k = 0; k < 3; k++) {
    ctx.strokeStyle = k % 2 ? "rgba(255,230,128,0.7)" : "rgba(160,220,255,0.6)";
    ctx.lineWidth = 5 - k;
    ctx.beginPath();
    ctx.ellipse(gx, gy, 26 + k * 9, 52 + k * 9, Math.sin(perf * 0.002 + k) * 0.2, perf * 0.003 + k * 2, perf * 0.003 + k * 2 + Math.PI * 1.5);
    ctx.stroke();
  }
  ctx.fillStyle = "rgba(255,230,128,0.18)";
  ctx.beginPath(); ctx.ellipse(gx, gy, 24, 50, 0, 0, Math.PI * 2); ctx.fill();
}

// ---------------- Special moves (super meter + cutscene) ----------------
// The bar under each fighter fills as they TAKE damage (300 total, carries
// across stocks). When full, press LIGHT+HEAVY together to unleash it.
const SUPER_MAX = 300;
const SPECIAL_NAMES = {
  blocky: "HEROIC NOVA", nyx: "THOUSAND STARS", tor: "WORLDBREAKER",
  sage: "ARCANE VORTEX", volt: "JUDGEMENT STORM", glacia: "ABSOLUTE ZERO",
  fang: "WILD FRENZY", rex: "FINAL LANCE", wren: "SKYFALL VOLLEY", devourer: "DEVOUR",
};
let cutscene = null; // { f, t, total, label, applied }

function tryActivateSpecial(f) {
  if (f.superMeter < SUPER_MAX || cutscene) return false;
  f.superMeter = 0;
  cutscene = { f, t: 0, total: 85, label: (f.isBot ? "BOT" : f.name), applied: false };
  netFx.push(["super", combatants.indexOf(f), f.name]);
  beep(200, 0.5, "sawtooth", 0.12, 400);
  return true;
}

function applySpecial(f) {
  const key = f.char.key;
  const arena = gameMode === "story" ? story.levelW : W;
  const foes = combatants.filter(o => o !== f && !o.dead && o.invuln < 60);
  const strike = (o, dmg, vx, vy, stun) => {
    o.damage = Math.min(999, o.damage + dmg);
    o.superMeter = Math.min(SUPER_MAX, o.superMeter + dmg);
    o.vx = vx; o.vy = vy;
    o.onGround = false;
    o.hitstun = stun || 32;
    o.attack = null;
    burst(o.x, o.y - o.h/2, "#ffe680", 22, 6);
  };
  const storyStrike = (range, dmgE, dmgB) => {
    if (gameMode !== "story") return;
    for (const e of enemies) if (Math.abs(e.x - f.x) < range) {
      e.hp -= dmgE; e.stun = 45; e.vx = Math.sign(e.x - f.x || 1) * 8;
      burst(e.x, e.y - e.h/2, "#ffe680", 14, 5);
    }
    const b = story && story.boss;
    if (b && b.hp > 0 && Math.abs(b.x - f.x) < range + 160) { b.hp -= dmgB; b.flash = 14; burst(b.x, b.y - b.h/2, "#ffe680", 26, 7); }
  };
  const nearestFoe = () => { let best = null, bd = 1e9; for (const o of foes) { const d = Math.abs(o.x - f.x); if (d < bd) { bd = d; best = o; } } return best; };
  shake = 22; sfx.ko();

  switch (key) {
    case "blocky": // HEROIC NOVA: massive blast around him
      for (const o of foes) if (Math.hypot(o.x - f.x, o.y - f.y) < 290) strike(o, 26, Math.sign(o.x - f.x || 1) * 14, -11);
      storyStrike(320, 65, 85);
      burst(f.x, f.y - f.h/2, "#ffe680", 60, 10);
      break;
    case "nyx": { // THOUSAND STARS: blink through the victim, shred them
      const t = nearestFoe();
      if (t) {
        const dir = Math.sign(t.x - f.x) || 1;
        f.x = Math.max(30, Math.min(arena - 30, t.x + dir * 46));
        f.facing = -dir;
        strike(t, 24, -dir * 12, -8);
        for (let k = 0; k < 5; k++) burst(f.x - dir * k * 32, f.y - f.h/2, "#a0f0ff", 8, 3);
      }
      f.invuln = Math.max(f.invuln, 90);
      storyStrike(430, 60, 75);
      break;
    }
    case "tor": // WORLDBREAKER: the ground itself erupts
      for (const o of foes) if (o.onGround || o.y > 380) strike(o, 24, Math.sign(o.x - f.x || 1) * 7, -16);
      storyStrike(620, 70, 90);
      burst(f.x, f.y, "#ffb14d", 50, 9);
      break;
    case "sage": // ARCANE VORTEX: drags everyone into her orbit
      for (const o of foes) if (Math.abs(o.x - f.x) < 540) {
        const dir = Math.sign(o.x - f.x) || 1;
        o.x = Math.max(30, Math.min(arena - 30, f.x + dir * 70));
        strike(o, 20, -dir * 4, -9);
      }
      if (gameMode === "story") for (const e of enemies) if (Math.abs(e.x - f.x) < 540) e.x = f.x + Math.sign(e.x - f.x || 1) * 85;
      storyStrike(540, 55, 70);
      burst(f.x, f.y - f.h/2, "#c89bff", 55, 9);
      break;
    case "volt": // JUDGEMENT STORM: a bolt for every soul on the stage
      for (const o of foes) { strike(o, 22, 0, -18); burst(o.x, o.y - o.h - 60, "#c8f4ff", 25, 6); }
      storyStrike(9999, 60, 80);
      break;
    case "glacia": // ABSOLUTE ZERO: deep-freezes everything near her
      for (const o of foes) if (Math.abs(o.x - f.x) < 500) strike(o, 16, 0, 2, 95);
      if (gameMode === "story") for (const e of enemies) if (Math.abs(e.x - f.x) < 500) e.stun = 130;
      storyStrike(500, 50, 65);
      burst(f.x, f.y - f.h/2, "#bfe8ff", 50, 8);
      break;
    case "fang": { // WILD FRENZY: savages the nearest victim, ends behind them
      const t = nearestFoe();
      if (t) {
        strike(t, 32, f.facing * 13, -9);
        f.x = Math.max(30, Math.min(arena - 30, t.x + Math.sign(t.x - f.x || 1) * 60));
        for (let k = 0; k < 6; k++) burst(f.x - k * 26 * f.facing, f.y - f.h/2, "#ff8080", 8, 4);
      }
      storyStrike(380, 85, 100);
      break;
    }
    case "wren": { // SKYFALL VOLLEY: the sky answers with arrows
      for (const o of foes) if (Math.abs(o.x - f.x) < 620) strike(o, 20, Math.sign(o.x - f.x || 1) * 6, -12);
      storyStrike(620, 55, 75);
      for (let k = 0; k < 16; k++) { // a real rain of arrows follows the blast
        projectiles.push({
          type: "arrow", x: Math.max(20, Math.min(arena - 20, f.x - 560 + k * 72 + Math.random() * 36)),
          y: -40 - Math.random() * 170, vx: (Math.random() - 0.5) * 1.4, vy: 10 + Math.random() * 4,
          owner: f, age: 0, life: 150, spin: Math.PI / 2, hitCd: new Map(), dmg: 11, kb: 8,
        });
      }
      burst(f.x, f.y - f.h/2, "#ffd9a0", 45, 8);
      break;
    }
    case "rex": // FINAL LANCE: pierces the whole row
      for (const o of foes) if (Math.abs((o.y - o.h/2) - (f.y - f.h/2)) < 130) strike(o, 24, f.facing * 16, -6);
      if (gameMode === "story") for (const e of enemies) if (Math.abs((e.y - e.h/2) - (f.y - f.h/2)) < 150) { e.hp -= 65; e.stun = 40; }
      storyStrike(750, 0, 90);
      f.x = Math.max(40, Math.min(arena - 40, f.x + f.facing * 520));
      for (let k = 0; k < 8; k++) burst(f.x - k * 62 * f.facing, f.y - f.h/2, "#9bffb0", 10, 4);
      break;
    default: { // devourer/TALHALLA: DEVOUR — bite them, heal himself
      const t = nearestFoe();
      if (t) strike(t, 30, Math.sign(t.x - f.x || 1) * 11, -9);
      f.damage = Math.max(0, f.damage - 40);
      storyStrike(420, 90, 120);
      burst(f.x, f.y - f.h/2, "#ff5a3c", 45, 8);
    }
  }
}

// ---------------- Fighter ----------------
class Fighter {
  constructor(name, color, colorDark, keymap, spawnX, facing) {
    this.name = name;
    this.color = color;
    this.colorDark = colorDark;
    this.keymap = keymap;
    this.spawnX = spawnX;
    this.spawnFacing = facing;
    this.isBot = false;
    this.botInput = {};
    this.prevInput = {};
    this.setCharacter(CHARACTERS[0]);
    this.resetMatch();
  }

  setCharacter(def) {
    this.char = def;
    this.w = def.w; this.h = def.h;
  }

  resetMatch() {
    this.stocks = 3;
    this.superMeter = 0; // fills from damage taken, survives across stocks
    this.rangUses = 0;
    this.respawn(true);
  }

  respawn(first) {
    this.x = this.spawnX; this.y = first ? 480 : 120;
    this.vx = 0; this.vy = 0;
    this.damage = 0;
    this.facing = this.spawnFacing;
    this.onGround = false;
    this.jumpsLeft = this.char.airJumps;
    this.recoveryUsed = false;
    this.fastFall = false;
    this.attack = null;       // {def, key, t, hitSet}
    this.hitstun = 0;
    this.dodgeT = 0;
    this.dodgeCD = 0;
    this.invuln = first ? 0 : 150;
    this.dropTimer = 0;
    this.dead = false;
    this.heldItem = null;
    // swallow buttons still held from menus so they don't edge-trigger at spawn
    this.snapshotInput();
  }

  input(action) {
    if (this.isBot) return !!this.botInput[action];
    if (this.netInput) return !!this.netInput[action]; // remote player (host-side)
    const pad = padState[this.padIndex];
    return !!keys[this.keymap[action]] || !!(pad && pad[action]);
  }
  pressed(action) {
    const now = this.input(action);
    const was = !!this.prevInput[action];
    return now && !was;
  }
  snapshotInput() {
    for (const a of ["left","right","up","down","light","heavy","dodge"]) this.prevInput[a] = this.input(a);
  }

  get rect() { return { x: this.x - this.w/2, y: this.y - this.h, w: this.w, h: this.h }; }

  hitbox() {
    if (!this.attack) return null;
    const d = this.attack.def;
    const t = this.attack.t;
    if (t < d.startup || t >= d.startup + d.active) return null;
    if (d.around) {
      return { x: this.x - d.w/2, y: this.y - this.h/2 - d.h/2, w: d.w, h: d.h };
    }
    if (d.below) {
      return { x: this.x - d.w/2, y: this.y - 10, w: d.w, h: d.h };
    }
    const bx = this.facing > 0 ? this.x : this.x - d.w;
    return { x: bx, y: this.y - this.h/2 - d.h/2 - 6, w: d.w, h: d.h };
  }

  startAttack(key) {
    const def = this.char.attacks[key];
    this.attack = { def, key, t: 0, hitSet: new Set() };
    if (def.dmg >= 12) sfx.heavy(); else beep(440, 0.05, "square", 0.03, 120);
  }

  update() {
    if (this.dead) return;
    const inHitstun = this.hitstun > 0;
    const dodging = this.dodgeT > 0;
    const attacking = !!this.attack;

    // --- timers ---
    if (this.hitstun > 0) this.hitstun--;
    if (this.dodgeT > 0) this.dodgeT--;
    if (this.dodgeCD > 0) this.dodgeCD--;
    if (this.invuln > 0) this.invuln--;
    if (this.dropTimer > 0) this.dropTimer--;

    // --- attack progression ---
    if (this.attack) {
      this.attack.t++;
      const d = this.attack.def;
      if (this.attack.t === d.startup) {
        // lunge forward on active frames
        this.vx += this.facing * d.lunge;
        // recovery moves: vertical boost or teleport on activation
        if (d.boostY !== undefined) {
          this.vy = d.boostY;
          if (d.boostX) this.vx = this.facing * d.boostX;
          this.fastFall = false;
          burst(this.x, this.y, this.char.arc, 12, 3);
        }
        if (d.teleport) {
          burst(this.x, this.y - this.h/2, this.char.arc, 16, 4);
          this.x += this.facing * d.teleport[0];
          this.y += d.teleport[1];
          this.vx = this.facing * 3;
          this.vy = -5;
          this.fastFall = false;
          burst(this.x, this.y - this.h/2, this.char.arc, 16, 4);
          sfx.dodge();
        }
        if (d.invuln) this.invuln = Math.max(this.invuln, d.invuln);
        // archer attacks loose a real arrow (simulated by host/local only —
        // clients receive projectiles via snapshots, never run update())
        if (d.arrow) {
          projectiles.push({
            type: "arrow", x: this.x + this.facing * (this.w/2 + 8), y: this.y - this.h * 0.62,
            vx: this.facing * d.arrow.vx, vy: d.arrow.vy,
            owner: this, age: 0, life: 90, spin: 0, hitCd: new Map(),
            dmg: d.arrow.dmg, kb: d.arrow.kb,
          });
          beep(720, 0.07, "square", 0.04, -260);
        }
      }
      if (this.attack.t >= d.startup + d.active + d.recovery) this.attack = null;
    }

    const canAct = !inHitstun && !dodging && !this.attack;

    // --- horizontal movement ---
    const accel = this.onGround ? this.char.accel : this.char.accel * 0.6;
    const maxSpd = this.char.speed;
    let move = 0;
    if (!inHitstun && !dodging) {
      if (this.input("left"))  move -= 1;
      if (this.input("right")) move += 1;
    }
    if (move !== 0 && (!this.attack || !this.onGround)) {
      this.vx += move * accel;
      if (canAct) this.facing = move;
    }
    // friction / drag (dashes keep their momentum)
    if (move === 0 || inHitstun) {
      this.vx *= this.onGround ? (dodging ? 0.96 : 0.80) : 0.97;
    }
    const cap = maxSpd + (inHitstun ? 20 : 0) + (this.dodgeT > 0 ? 10 : 0);
    this.vx = Math.max(-cap, Math.min(cap, this.vx));

    // --- jumping ---
    if (canAct && this.pressed("up") && this.jumpsLeft > 0) {
      this.vy = this.char.jumpVel;
      if (!this.onGround) this.jumpsLeft--;
      else sfx.jump();
      this.onGround = false;
      this.fastFall = false;
      burst(this.x, this.y, "#ffffff", 6, 2);
    }

    // --- drop through soft platforms ---
    if (canAct && this.onGround && this.pressed("down")) {
      const feetY = this.y;
      const onSoft = platforms.some(p => !p.solid &&
        this.x > p.x - 5 && this.x < p.x + p.w + 5 && Math.abs(feetY - p.y) < 4);
      if (onSoft) { this.dropTimer = 12; this.onGround = false; this.y += 6; }
    }

    // --- fast fall ---
    if (!this.onGround && this.input("down") && this.vy > 0) this.fastFall = true;

    // --- dash-dodge: i-frames plus a burst of speed in the held direction ---
    if (canAct && this.pressed("dodge") && this.dodgeCD <= 0) {
      this.dodgeT = 18;
      this.dodgeCD = 70;
      let dx = 0, dy = 0;
      if (this.input("left"))  dx -= 1;
      if (this.input("right")) dx += 1;
      if (this.input("up"))    dy -= 1;
      if (this.input("down"))  dy += 1;
      if (this.onGround && dy > 0) dy = 0; // can't dash into the floor
      if (dx !== 0 || dy !== 0) {
        const m = Math.hypot(dx, dy);
        this.vx = (dx / m) * 13;
        this.vy = (dy / m) * 13;
        this.fastFall = false;
        if (dx !== 0) this.facing = dx;
        burst(this.x, this.y - this.h/2, "#ffffff", 8, 2.5);
      }
      sfx.dodge();
    }

    // --- attacks ---
    if (canAct) {
      const bothAtk = (this.pressed("light") && this.input("heavy")) || (this.pressed("heavy") && this.input("light"));
      if (bothAtk && this.superMeter >= SUPER_MAX && !cutscene) {
        tryActivateSpecial(this);
      } else if (this.pressed("light")) {
        if (this.heldItem) throwItem(this); // holding an item: light throws it
        else this.startAttack(this.onGround ? "lightGround" : "lightAir");
      } else if (this.pressed("heavy")) {
        if (!this.onGround && this.input("up") && !this.recoveryUsed) {
          this.recoveryUsed = true;
          this.startAttack("recovery");
        }
        else if (!this.onGround && this.input("down")) this.startAttack("spike");
        else this.startAttack(this.onGround ? "heavyGround" : "heavyAir");
      }
    }

    // --- gravity ---
    const grav = this.fastFall ? 1.15 : 0.55;
    this.vy += grav;
    this.vy = Math.min(this.vy, this.fastFall ? 17 : 12);

    // --- integrate & collide ---
    this.x += this.vx;
    const prevBottom = this.y;
    this.y += this.vy;
    this.onGround = false;

    for (const p of platforms) {
      const r = this.rect;
      if (p.solid) {
        // solid AABB resolution
        if (r.x < p.x + p.w && r.x + r.w > p.x && r.y < p.y + p.h && r.y + r.h > p.y) {
          const overlapX = Math.min(r.x + r.w - p.x, p.x + p.w - r.x);
          const overlapY = Math.min(r.y + r.h - p.y, p.y + p.h - r.y);
          if (overlapY <= overlapX) {
            if (this.y - this.h/2 < p.y + p.h/2) { // from top
              this.y = p.y; this.vy = 0; this.land();
            } else {
              this.y = p.y + p.h + this.h; this.vy = Math.max(this.vy, 0);
            }
          } else {
            if (this.x < p.x + p.w/2) this.x = p.x - this.w/2;
            else this.x = p.x + p.w + this.w/2;
            this.vx = 0;
          }
        }
      } else {
        // soft platform: land only when falling onto it from above
        if (this.vy >= 0 && this.dropTimer <= 0 &&
            prevBottom <= p.y + 1 && this.y >= p.y &&
            this.x > p.x - this.w/2 + 6 && this.x < p.x + p.w + this.w/2 - 6) {
          this.y = p.y; this.vy = 0; this.land();
        }
      }
    }

    // --- blast zones / KO ---
    if (gameMode === "story") {
      // levels are walled at the sides; only pits are deadly
      this.x = Math.max(16, Math.min(story.levelW - 16, this.x));
      if (this.y > BLAST.bottom) this.ko();
    } else if (this.x < BLAST.left || this.x > BLAST.right || this.y - this.h < BLAST.top || this.y > BLAST.bottom) {
      this.ko();
    }

    this.snapshotInput();
  }

  land() {
    if (!this.onGround) {
      this.onGround = true;
      this.jumpsLeft = this.char.airJumps;
      this.recoveryUsed = false;
      this.fastFall = false;
    }
  }

  ko() {
    this.stocks--;
    sfx.ko();
    shake = 18;
    // KO streak toward the blast zone edge
    const kx = Math.max(BLAST.left + 10, Math.min(BLAST.right - 10, this.x));
    const ky = Math.max(BLAST.top + 10, Math.min(BLAST.bottom - 10, this.y));
    burst(kx, ky, this.color, 40, 7);
    if (this.stocks <= 0) {
      this.dead = true;
    } else {
      if (gameMode === "story") {
        // drop back in near a living teammate (or the level start)
        const ally = combatants.find(f => f !== this && !f.dead);
        this.spawnX = ally ? Math.max(60, Math.min(story.levelW - 60, ally.x)) : story.spawnX;
      }
      this.respawn(false);
    }
  }

  takeHit(atk, attacker) {
    const d = atk.def;
    this.damage = Math.min(999, this.damage + d.dmg);
    this.superMeter = Math.min(SUPER_MAX, this.superMeter + d.dmg);
    const kb = (d.baseKB + this.damage * d.kbScale) / this.char.weight;
    const dir = attacker.facing;
    this.vx = d.ang[0] * kb * (d.below ? Math.sign(this.x - attacker.x) || dir : dir);
    this.vy = d.ang[1] * kb;
    // spike only spikes airborne targets; grounded targets pop up instead
    if (d.below && this.onGround) this.vy = -Math.abs(this.vy) * 0.8;
    this.onGround = false;
    this.hitstun = Math.min(40, 8 + kb * 1.1);
    this.attack = null;
    hitstop = d.dmg >= 12 ? 7 : 3;
    shake = Math.min(16, 3 + kb * 0.5);
    burst(this.x, this.y - this.h/2, "#ffd24d", 12 + kb, 3 + kb * 0.25);
    sfx.hit();
  }

  // ---------------- rendering ----------------
  draw() {
    if (this.dead) return;
    const r = this.rect;
    const flicker = this.invuln > 0 && Math.floor(this.invuln / 4) % 2 === 0;
    ctx.save();
    ctx.globalAlpha = this.dodgeT > 0 ? 0.35 : (flicker ? 0.45 : 1);

    if (this.char.key === "devourer" && bossImg && bossImg.complete) {
      // the unlocked Devourer fights as his true face
      ctx.lineWidth = 3; ctx.strokeStyle = this.color;
      roundRect(r.x - 3, r.y - 3, r.w + 6, r.h + 6, 10); ctx.stroke();
      ctx.save();
      if (this.facing < 0) { ctx.translate(this.x, 0); ctx.scale(-1, 1); ctx.translate(-this.x, 0); }
      ctx.drawImage(bossImg, r.x - 5, r.y - 8, r.w + 10, r.h + 10);
      ctx.restore();
    } else {
      // body
      ctx.fillStyle = this.colorDark;
      roundRect(r.x - 2, r.y - 2, r.w + 4, r.h + 4, 10); ctx.fill();
      ctx.fillStyle = this.color;
      roundRect(r.x, r.y, r.w, r.h, 8); ctx.fill();

      // face
      ctx.fillStyle = "#0b0e1a";
      const ex = this.x + this.facing * 10;
      ctx.fillRect(ex - 3, r.y + 14, 6, 8);
      ctx.fillRect(ex + this.facing * 9 - 3, r.y + 14, 6, 8);

      drawDecor(this.char.key, r, this.facing, this.colorDark);
    }

    // weapon animation — purely cosmetic, per character (hitboxes are unchanged)
    if (this.attack) drawWeapon(this);
    ctx.restore();
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// ---------------- Bot AI ----------------
function botThink(bot, foe) {
  const inp = {};
  if (bot.dead || foe.dead) { bot.botInput = inp; return; }
  const dx = foe.x - bot.x;
  const dy = (foe.y - foe.h/2) - (bot.y - bot.h/2);

  // which solid platform is under a given x (highest one that spans it)?
  const solidUnder = x => {
    let best = null;
    for (const p of platforms) {
      if (!p.solid) continue;
      if (x > p.x - 15 && x < p.x + p.w + 15 && (!best || p.y < best.y)) best = p;
    }
    return best;
  };
  const nearestSolid = x => {
    let best = null, bd = Infinity;
    for (const p of platforms) {
      if (!p.solid) continue;
      const d = Math.abs(p.x + p.w/2 - x);
      if (d < bd) { bd = d; best = p; }
    }
    return best;
  };
  const botPlat = solidUnder(bot.x);
  const foePlat = solidUnder(foe.x);

  // --- nothing under us: mid-crossing or knocked offstage. Fly toward the
  // foe's island if it has one, else the nearest — never stall over a gap. ---
  if (!botPlat || bot.y > botPlat.y + 40) {
    const target = (!botPlat && foePlat) ? foePlat : (botPlat || nearestSolid(bot.x));
    const tx = target.x + target.w/2;
    if (bot.x < tx) inp.right = true; else inp.left = true;
    if (bot.vy > 1 && bot.jumpsLeft > 0 && !bot.prevInput.up && bot.y > target.y - 80) inp.up = true;
    // out of jumps and still falling: burn the recovery special
    if (bot.jumpsLeft <= 0 && !bot.recoveryUsed && bot.vy > 0 && bot.y > target.y - 60) {
      inp.up = true; inp.heavy = true;
    }
    bot.botInput = inp; return;
  }

  // --- foe is on a different island: commit to the crossing ---
  if (foePlat && foePlat !== botPlat && Math.abs(dx) > 60) {
    if (dx > 0) inp.right = true; else inp.left = true;
    const edge = dx > 0 ? botPlat.x + botPlat.w : botPlat.x;
    if (bot.onGround && Math.abs(edge - bot.x) < 45) inp.up = true; // leap off the edge
    if (!bot.onGround && bot.vy > 0 && bot.jumpsLeft > 0 && !bot.prevInput.up) inp.up = true;
    // swing if the foe drifts into range mid-flight
    if (Math.abs(dx) < 78 && Math.abs(dy) < 70 && !bot.attack && bot.hitstun <= 0 && Math.random() < 0.12) inp.light = true;
    bot.botInput = inp; return;
  }

  // spacing
  if (Math.abs(dx) > 55) { if (dx > 0) inp.right = true; else inp.left = true; }
  // chase upward
  if (dy < -90 && Math.abs(dx) < 160 && bot.onGround && Math.random() < 0.06) inp.up = true;
  if (dy < -90 && !bot.onGround && bot.vy > 0 && bot.jumpsLeft > 0 && Math.random() < 0.08) inp.up = true;
  // drop down to foe below
  if (dy > 90 && bot.onGround && Math.random() < 0.05) inp.down = true;

  // wren bots pepper from range instead of always closing in
  if (bot.char.key === "wren" && !bot.attack && bot.hitstun <= 0 && bot.onGround &&
      Math.abs(dx) > 110 && Math.abs(dx) < 430 && Math.abs(dy) < 70 && Math.random() < 0.045) inp.heavy = true;
  // got an item? hurl it when roughly lined up
  if (bot.heldItem && Math.abs(dx) < 360 && Math.abs(dy) < 90 && Math.random() < 0.04) inp.light = true;
  // meter full? unleash the special when in range
  if (bot.superMeter >= SUPER_MAX && Math.abs(dx) < 320 && Math.random() < 0.05) { inp.light = true; inp.heavy = true; }

  const close = Math.abs(dx) < 78 && Math.abs(dy) < 70;
  if (close && !bot.attack && bot.hitstun <= 0) {
    // occasionally dodge a windup instead of trading
    const foeWindingUp = foe.attack && foe.attack.t < foe.attack.def.startup;
    if (foeWindingUp && bot.dodgeCD <= 0 && Math.random() < 0.35) {
      inp.dodge = true;
      if (dx > 0) inp.left = true; else inp.right = true;
    } else if (Math.random() < 0.14) {
      if (foe.damage > 90 && Math.random() < 0.5) inp.heavy = true;
      else inp.light = true;
    }
  }
  // spike attempt when foe is below offstage
  if (!bot.onGround && dy > 40 && Math.abs(dx) < 50 && Math.random() < 0.1) { inp.down = true; inp.heavy = true; }

  bot.botInput = inp;
}

// ---------------- Game state ----------------
let state = "menu";           // menu | charselect | mapselect | playing | gameover
let mode = "bot";             // "2p" | "bot"
let winner = null;
let menuIndex = 0;
let sel = null;               // character-select state
let mapSel = { idx: 0 };      // map-select state
let selLatch = {};

const p1 = new Fighter("P1", "#4da6ff", "#1f5fa8", P1_KEYS, W/2 - 200,  1);
const p2 = new Fighter("P2", "#ff6b4d", "#a83a1f", P2_KEYS, W/2 + 200, -1);
const p3 = new Fighter("P3", "#6bff9d", "#2fa85c", P3_KEYS, W/2 - 320,  1);
const p4 = new Fighter("P4", "#ffd24d", "#a8862a", P4_KEYS, W/2 + 320, -1);
p1.padIndex = 0; p2.padIndex = 1; p3.padIndex = 2; p4.padIndex = 3;
const fighters = [p1, p2, p3, p4]; // menu/select input owners
let combatants = [p1, p2];      // who is actually in the match (survival adds bots)

let gameMode = "classic";       // classic | party | arcade | survival
let partyRoster = [];           // fighter indices in the current free-for-all
let arcade = null;              // { stage }
let surv = null;                // { score, spawned, interval, spawnT, best }
let banner = null;              // { text, t } floating announcement
let gameOver = null;            // { title, sub, color }

// each champion defends the biome that suits them
const ARCADE_MAPKEY = { blocky: "skyholm", nyx: "neon", tor: "magma", sage: "hall", rex: "pillars", volt: "skyholm", glacia: "frost", fang: "hall", wren: "frost", devourer: "pillars" };
const SURV_COLORS = [
  ["#ff6b4d", "#a83a1f"], ["#ffd24d", "#a8862a"], ["#b06bff", "#6a35a8"],
  ["#6bff9d", "#2fa85c"], ["#ff6bd4", "#a8348a"], ["#7df0ff", "#3a92a8"],
];
const HS_KEY = "talhalla_highscore";
function getHighScore() { try { return +localStorage.getItem(HS_KEY) || 0; } catch (e) { return 0; } }
function setHighScore(v) { try { localStorage.setItem(HS_KEY, v); } catch (e) {} }

// ---------------- Online multiplayer (WebRTC via PeerJS) ----------------
// Host runs the whole simulation; clients send their inputs and render the
// host's snapshots. Everyone uses their own machine's P1 controls / pad 1.
let net = null;        // { role, peer, code, conns{slot:conn}, host, lobby, mySlot, status, err, snap, hostPicking, sentOver }
let joinCode = "";
let onlineIdx = 0;

const CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function genCode() { let s = ""; for (let i = 0; i < 5; i++) s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]; return s; }

// STUN finds a direct path between homes; TURN relays traffic when strict
// routers block direct P2P. Makes online work on any network, not just easy ones.
const PEER_OPTS = {
  config: {
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" },
      { urls: "turn:openrelay.metered.ca:80",  username: "openrelayproject", credential: "openrelayproject" },
      { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" },
      { urls: "turn:openrelay.metered.ca:443?transport=tcp", username: "openrelayproject", credential: "openrelayproject" },
    ],
  },
};

// local-player input (always P1 keys / pad 1, whatever slot we occupy online)
function localOn(a) { const pad = padState[0]; return !!keys[P1_KEYS[a]] || !!(pad && pad[a]); }
let localLatch = {};
function localEdge(a) { const now = localOn(a); const was = !!localLatch[a]; localLatch[a] = now; return now && !was; }
function primeLocalLatch() { localLatch = {}; for (const a of ["left","right","up","down","light","heavy","dodge"]) localLatch[a] = localOn(a); }

function readLocalInputByte() {
  return (localOn("left") ? 1 : 0) | (localOn("right") ? 2 : 0) | (localOn("up") ? 4 : 0) | (localOn("down") ? 8 : 0)
       | (localOn("light") ? 16 : 0) | (localOn("heavy") ? 32 : 0) | (localOn("dodge") ? 64 : 0);
}
function applyInputByte(f, b) {
  const n = f.netInput;
  n.left = !!(b & 1); n.right = !!(b & 2); n.up = !!(b & 4); n.down = !!(b & 8);
  n.light = !!(b & 16); n.heavy = !!(b & 32); n.dodge = !!(b & 64);
}

function netCleanup() {
  if (!net) return;
  const n = net; net = null;
  try { if (n.peer) n.peer.destroy(); } catch (e) {}
  for (const f of fighters) f.netInput = null;
}

function netBroadcast(msg) {
  if (!net || !net.conns) return;
  for (const s in net.conns) {
    const c = net.conns[s];
    if (c && c.open) { try { c.send(msg); } catch (e) {} }
  }
}

function sendLobby() {
  if (!net || !net.conns) return;
  for (const s in net.conns) {
    const c = net.conns[s];
    if (c && c.open) { try { c.send({ t: "lob", chars: net.lobby.chars, ready: net.lobby.ready, you: +s, code: net.code, mode: net.lobby.mode || 0 }); } catch (e) {} }
  }
}

function lobbyReady() {
  const occ = [0,1,2,3].filter(s => net.lobby.chars[s] >= 0);
  return occ.length >= 2 && occ.every(s => net.lobby.ready[s]);
}

function startHost() {
  if (typeof Peer === "undefined") { net = { role: "none", err: "Online module failed to load — check your internet, then reopen the game." }; return; }
  const code = genCode();
  net = { role: "host", code, conns: {}, lobby: { chars: [0,-1,-1,-1], ready: [false,false,false,false], mode: 0 },
          mySlot: 0, status: "starting", err: null, hostPicking: false, sentOver: false };
  gameMode = "party";
  net.peer = new Peer("talhalla-" + code.toLowerCase(), PEER_OPTS);
  net.peer.on("open", () => { if (!net) return; net.status = "open"; primeLocalLatch(); state = "lobby"; });
  net.peer.on("connection", conn => {
    conn.on("open", () => {
      if (!net || net.role !== "host") { try { conn.close(); } catch (e) {} return; }
      const slot = [1,2,3].find(s => net.lobby.chars[s] < 0 && !net.conns[s]);
      if (slot === undefined || state === "playing" || state === "gameover") {
        try { conn.send({ t: "full" }); setTimeout(() => conn.close(), 200); } catch (e) {}
        return;
      }
      net.conns[slot] = conn;
      net.lobby.chars[slot] = 0;
      net.lobby.ready[slot] = false;
      fighters[slot].netInput = {};
      conn.on("data", d => hostMsg(slot, d));
      conn.on("close", () => hostDrop(slot));
      conn.on("error", () => hostDrop(slot));
      sendLobby();
    });
  });
  net.peer.on("error", err => {
    if (!net) return;
    net.err = err.type === "unavailable-id" ? "Code collision — press ESC and host again." : "Connection error: " + (err.type || err);
  });
}

function hostDrop(slot) {
  if (!net || net.role !== "host" || !net.conns[slot]) return;
  delete net.conns[slot];
  net.lobby.chars[slot] = -1;
  net.lobby.ready[slot] = false;
  const f = fighters[slot];
  f.netInput = null;
  if (state === "playing" && combatants.includes(f)) { f.stocks = 0; f.dead = true; } // dropped mid-match
  if (state === "lobby") sendLobby();
}

function hostMsg(slot, d) {
  if (!net || !d) return;
  if (d.t === "i") {
    const f = fighters[slot];
    if (f.netInput) applyInputByte(f, d.b | 0);
  } else if (d.t === "pick" && state === "lobby" && !net.lobby.ready[slot]) {
    net.lobby.chars[slot] = (net.lobby.chars[slot] + (d.d > 0 ? 1 : CHARACTERS.length - 1)) % CHARACTERS.length;
    sendLobby();
  } else if (d.t === "ready" && state === "lobby") {
    if (!net.lobby.ready[slot] && charLocked(net.lobby.chars[slot])) return; // can't ready a locked fighter
    net.lobby.ready[slot] = !net.lobby.ready[slot];
    sendLobby();
  }
}

function netStartStory(ch) {
  netBroadcast({ t: "startStory", ch, chars: net.lobby.chars });
  netInitStory(ch, net.lobby.chars);
}

function netInitStory(ch, chars) {
  partyRoster = [];
  for (let s = 0; s < 4; s++) {
    if (chars[s] >= 0) {
      fighters[s].setCharacter(CHARACTERS[chars[s]]);
      partyRoster.push(s);
    }
  }
  storySel = ch;
  startStoryLevel(ch);
  if (net) net.sentOver = false;
}

function startJoin(code) {
  if (typeof Peer === "undefined") { net = { role: "none", err: "Online module failed to load — check your internet, then reopen the game." }; return; }
  net = { role: "client", code, status: "connecting", err: null, lobby: null, mySlot: -1, snap: null, hostPicking: false };
  gameMode = "party";
  net.peer = new Peer(PEER_OPTS);
  net.peer.on("open", () => {
    if (!net) return;
    const c = net.peer.connect("talhalla-" + code.toLowerCase(), { reliable: true });
    net.host = c;
    c.on("open", () => { if (net) net.status = "connected"; });
    c.on("data", d => clientMsg(d));
    c.on("close", () => { if (net && net.role === "client") { netCleanup(); state = "menu"; } });
  });
  net.peer.on("error", err => {
    if (!net) return;
    net.err = err.type === "peer-unavailable" ? "Room not found — check the code." : "Connection error: " + (err.type || err);
  });
}

function clientMsg(d) {
  if (!net || !d) return;
  if (d.t === "lob") {
    net.lobby = { chars: d.chars, ready: d.ready, mode: d.mode || 0 };
    net.mySlot = d.you;
    net.code = d.code;
    net.hostPicking = false;
    if (state !== "playing" && state !== "gameover") { primeLocalLatch(); state = "lobby"; }
  } else if (d.t === "picking") {
    net.hostPicking = true;
  } else if (d.t === "start") {
    netInitMatch(d.map, d.chars, d.items);
  } else if (d.t === "startStory") {
    netInitStory(d.ch, d.chars);
  } else if (d.t === "s") {
    net.snap = d;
  } else if (d.t === "over") {
    gameOver = d.go;
    state = "gameover";
    menuKeyLatch = {};
  } else if (d.t === "tolobby") {
    net.hostPicking = false;
    primeLocalLatch();
    state = "lobby";
  } else if (d.t === "full") {
    netCleanup();
    net = { role: "none", err: "That room is full or already fighting." };
    state = "online";
  }
}

function netInitMatch(mapIdx, chars, itemsFlag) {
  currentMap = MAPS[mapIdx];
  gameMode = "party";
  matchItems = itemsFlag !== undefined ? !!itemsFlag : true;
  partyRoster = [];
  for (let s = 0; s < 4; s++) {
    if (chars[s] >= 0) {
      fighters[s].setCharacter(CHARACTERS[chars[s]]);
      partyRoster.push(s);
    }
  }
  startParty();
  if (net) net.sentOver = false;
}

function netStartMatch() {
  const mapIdx = MAPS.indexOf(currentMap);
  netBroadcast({ t: "start", map: mapIdx, chars: net.lobby.chars, items: itemsOn });
  netInitMatch(mapIdx, net.lobby.chars, itemsOn);
}

function buildSnapshot() {
  const snap = { t: "s", f: combatants.map(F => [
    Math.round(F.x * 10) / 10, Math.round(F.y * 10) / 10, F.facing, Math.round(F.damage), F.stocks,
    F.attack ? F.attack.key : 0, F.attack ? F.attack.t : 0, Math.round(F.dodgeT), Math.round(F.invuln), F.dead ? 1 : 0,
    F.heldItem ? ITEM_TYPES.indexOf(F.heldItem) + 1 : 0, Math.round(F.superMeter),
  ]) };
  snap.it = items.map(i => [ITEM_TYPES.indexOf(i.type), Math.round(i.x), Math.round(i.y), i.landed ? 1 : 0]);
  snap.pj = projectiles.map(p => [PROJ_TYPES.indexOf(p.type), Math.round(p.x), Math.round(p.y), Math.round(p.spin * 10) / 10]);
  if (netFx.length) { snap.fx = netFx.slice(); netFx.length = 0; }
  if (gameMode === "story" && story) {
    snap.cx = Math.round(camX);
    snap.en = enemies.map(e => [ENEMY_KEYS.indexOf(e.t), Math.round(e.x), Math.round(e.y), Math.round(100 * e.hp / e.maxHp), e.stun > 0 ? 1 : 0, e.dir]);
    snap.ep = enemyProjs.map(p => [PROJ_KINDS.indexOf(p.kind), Math.round(p.x), Math.round(p.y), Math.round(p.spin * 10) / 10]);
    snap.bo = story.boss ? [Math.round(story.boss.x), Math.round(story.boss.y), story.boss.hp, story.boss.facing,
                            story.boss.flash, story.boss.phase, story.boss.action === "charge" ? 1 : 0, story.boss.actT] : 0;
  }
  return snap;
}
const ENEMY_KEYS = ["shade", "brute", "wisp", "spiker"];
const PROJ_KINDS = ["spike", "orb", "wave"];

function applySnapshot(snap) {
  for (let i = 0; i < snap.f.length && i < combatants.length; i++) {
    const F = combatants[i];
    const [x, y, facing, dmg, stocks, ak, at, dt, inv, dead, held, mtr] = snap.f[i];
    F.heldItem = held ? ITEM_TYPES[held - 1] : null;
    F.superMeter = mtr || 0;
    F.x = x; F.y = y; F.facing = facing;
    if (dmg > F.damage) { // got hit: local flash + sound
      burst(F.x, F.y - F.h/2, "#ffd24d", 14, 4);
      shake = Math.min(14, 4 + (dmg - F.damage) * 0.5);
      sfx.hit();
    }
    if (stocks < F.stocks) { sfx.ko(); shake = 18; burst(F.x, F.y - F.h/2, F.color, 40, 7); }
    F.damage = dmg; F.stocks = stocks;
    F.attack = ak ? { def: F.char.attacks[ak], key: ak, t: at, hitSet: new Set() } : null;
    F.dodgeT = dt; F.invuln = inv;
    F.dead = !!dead;
  }
  if (snap.it) items = snap.it.map(a => ({ type: ITEM_TYPES[a[0]], x: a[1], y: a[2], landed: !!a[3], life: 300, bob: 0 }));
  if (snap.pj) projectiles = snap.pj.map(a => ({ type: PROJ_TYPES[a[0]], x: a[1], y: a[2], spin: a[3], life: 300, hitCd: new Map() }));
  if (snap.fx) for (const e of snap.fx) {
    if (e[0] === "boom") {
      burst(e[1], e[2], "#ff9a4d", 40, 8);
      burst(e[1], e[2], "#ffe680", 25, 5);
      shake = 20; sfx.ko();
    } else if (e[0] === "super") {
      const sf = combatants[e[1]];
      if (sf) { cutscene = { f: sf, t: 0, total: 85, label: e[2] || sf.name }; beep(200, 0.5, "sawtooth", 0.12, 400); }
    }
  }
  // story world (client renders the host's simulation)
  if (gameMode === "story" && story) {
    if (snap.cx !== undefined) camX = snap.cx;
    if (snap.en) enemies = snap.en.map(a => {
      const t = ENEMY_KEYS[a[0]], d = ENEMY_TYPES[t];
      return { t, x: a[1], y: a[2], hp: Math.max(1, d.hp * a[3] / 100), maxHp: d.hp, stun: a[4] ? 10 : 0,
               dir: a[5] || -1, w: d.w, h: d.h, wob: a[1] % 6, vx: 0, vy: 0, baseY: a[2], cd: 999 };
    });
    if (snap.ep) enemyProjs = snap.ep.map(a => ({ kind: PROJ_KINDS[a[0]], x: a[1], y: a[2], spin: a[3], vx: 0, vy: 0, life: 999 }));
    if (snap.bo !== undefined) {
      if (snap.bo) {
        if (!story.boss) story.boss = { w: 150, h: 170, maxHp: snap.bo[2], vy: 0, timer: 0, actT: 0, action: "idle" };
        const b = story.boss;
        b.x = snap.bo[0]; b.y = snap.bo[1]; b.hp = snap.bo[2]; b.facing = snap.bo[3];
        b.flash = snap.bo[4]; b.phase = snap.bo[5];
        b.action = snap.bo[6] ? "charge" : "idle"; b.actT = snap.bo[7];
        if (b.maxHp < b.hp) b.maxHp = b.hp;
      } else if (story.boss) story.boss.hp = 0;
    }
  }
}

function clientNetTick() {
  if (net.host && net.host.open) { try { net.host.send({ t: "i", b: readLocalInputByte() }); } catch (e) {} }
  if (net.snap) { applySnapshot(net.snap); net.snap = null; }
  if (cutscene) { cutscene.t++; if (cutscene.t > 100) cutscene = null; }
  if (banner && banner.t > 0) banner.t--;
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life--; }
  particles = particles.filter(p => p.life > 0);
  if (shake > 0) shake *= 0.86;
}

function startMatch() {
  platforms = currentMap.platforms;
  p1.spawnX = currentMap.spawns[0];
  p2.spawnX = currentMap.spawns[1];
  p1.resetMatch(); p2.resetMatch();
  p2.isBot = (mode === "bot");
  combatants = [p1, p2];
  particles = []; shake = 0; hitstop = 0;
  items = []; projectiles = []; itemTimer = 0; netFx = [];
  matchItems = itemsOn;
  winner = null; gameOver = null; banner = null;
  state = "playing";
}

function startArcadeStage() {
  const opp = CHARACTERS[arcade.stage];
  currentMap = MAPS.find(m => m.key === ARCADE_MAPKEY[opp.key]) || MAPS[0];
  p2.setCharacter(opp);
  mode = "bot";
  startMatch();
  banner = { text: "STAGE " + (arcade.stage + 1) + "/" + CHARACTERS.length + "  ·  " + opp.name + " awaits at " + currentMap.name, t: 200 };
}

function endArcade(won) {
  gameOver = won
    ? { title: "CHAMPION!", sub: "You conquered all " + CHARACTERS.length + " home biomes", color: "#ffe680" }
    : { title: "ARCADE OVER", sub: "Fell at stage " + (arcade.stage + 1) + "/" + CHARACTERS.length + " against " + p2.char.name, color: "#ff6b4d" };
  state = "gameover";
  menuKeyLatch = {};
}

// spread n players evenly over the map's solid platforms
function partySpawns(n) {
  const solids = platforms.filter(p => p.solid);
  const groups = solids.map(() => []);
  for (let i = 0; i < n; i++) groups[i % solids.length].push(i);
  const xs = new Array(n);
  groups.forEach((members, gi) => {
    const p = solids[gi];
    members.forEach((pi, k) => { xs[pi] = p.x + p.w * (k + 1) / (members.length + 1); });
  });
  return xs;
}

function startParty() {
  platforms = currentMap.platforms;
  const xs = partySpawns(partyRoster.length);
  combatants = [];
  partyRoster.forEach((idx, k) => {
    const f = fighters[idx];
    f.isBot = false;
    f.spawnX = xs[k];
    f.spawnFacing = xs[k] < W / 2 ? 1 : -1;
    f.resetMatch();
    combatants.push(f);
  });
  particles = []; shake = 0; hitstop = 0;
  items = []; projectiles = []; itemTimer = 0; netFx = [];
  matchItems = net ? matchItems : itemsOn; // online: host's setting arrives via the start message
  winner = null; gameOver = null;
  banner = { text: partyRoster.length + "-PLAYER FREE FOR ALL!", t: 150 };
  state = "playing";
}

function startSurvival() {
  platforms = currentMap.platforms;
  p1.spawnX = currentMap.spawns[0];
  p1.resetMatch();
  combatants = [p1];
  surv = { score: 0, spawned: 0, interval: 840, spawnT: 60, best: getHighScore() };
  particles = []; shake = 0; hitstop = 0;
  items = []; projectiles = []; itemTimer = 0; netFx = [];
  matchItems = itemsOn;
  winner = null; gameOver = null;
  banner = { text: "SURVIVE!  Every bot you beat is worth 1 point", t: 200 };
  state = "playing";
}

function spawnSurvivalBot() {
  const [c, cd] = SURV_COLORS[surv.spawned % SURV_COLORS.length];
  const pool = CHARACTERS.filter((ch2, i) => !charLocked(i));
  const ch = pool[Math.floor(Math.random() * pool.length)];
  const b = new Fighter("BOT", c, cd, P2_KEYS, currentMap.spawns[1], -1);
  b.isBot = true;
  b.padIndex = 99; // never reads a real gamepad
  b.setCharacter(ch);
  b.spawnX = currentMap.spawns[Math.floor(Math.random() * currentMap.spawns.length)];
  b.stocks = 1;
  b.respawn(false);
  surv.spawned++;
  combatants.push(b);
  banner = { text: ch.name + " joins the fray!", t: 90 };
}

function gotoMenu() {
  // quitting a survival run still banks a new high score
  if (state === "playing" && gameMode === "survival" && surv && surv.score > surv.best) setHighScore(surv.score);
  if (net) netCleanup(); // leaving an online room disconnects cleanly
  state = "menu";
  // prime latches so buttons still held down don't instantly re-trigger in the menu
  menuKeyLatch = { Enter: !!keys["Enter"], Space: !!keys["Space"] };
  padLatch = { confirm: true, navUp: true, navDown: true, pause: true };
}

function openCharSelect() {
  const party = gameMode === "party" || gameMode === "story"; // join-in co-op select
  const solo = gameMode === "arcade" || gameMode === "survival";
  const classicBot = gameMode === "classic" && mode === "bot";
  const slots = party ? 4 : (solo ? 1 : 2);
  p2.isBot = classicBot;
  p2.botInput = {};
  sel = {
    slots,
    // party/story: only P1 pre-joined; classic: both slots joined; solo: P1 only
    joined:    [true, party ? false : (slots >= 2), false, false],
    isBotSlot: [false, classicBot, false, false],
    idx:       [0, classicBot ? Math.floor(Math.random() * CHARACTERS.length) : 0, 0, 0],
    confirmed: [false, classicBot, false, false],
    count: 0,
  };
  selLatch = {};
  for (let i = 0; i < slots; i++)
    for (const a of ["left", "right", "up", "down", "light", "heavy"]) selLatch[i + ":" + a] = fighters[i].input(a);
  state = "charselect";
}

// how many joined slots there are, and whether everyone's locked in
function selJoinedIdx() { const r = []; for (let i = 0; i < sel.slots; i++) if (sel.joined[i]) r.push(i); return r; }
function selReady() {
  const j = selJoinedIdx();
  const min = gameMode === "party" ? 2 : (gameMode === "story" ? 1 : sel.slots);
  return j.length >= min && j.every(i => sel.confirmed[i]);
}

function openMapSelect() {
  state = "mapselect";
  mapSel = { idx: MAPS.indexOf(currentMap) };
  selLatch = {};
  for (let i = 0; i < sel.slots; i++) {
    if (sel.isBotSlot[i]) continue;
    for (const a of ["left", "right", "up", "down", "light", "heavy"]) selLatch[i + ":" + a] = fighters[i].input(a);
  }
}

function selEdge(i, action) {
  const now = fighters[i].input(action);
  const k = i + ":" + action;
  const was = !!selLatch[k];
  selLatch[k] = now;
  return now && !was;
}

// menu key handling (edge-triggered)
let menuKeyLatch = {};
function menuPressed(code) {
  const now = !!keys[code];
  const was = !!menuKeyLatch[code];
  menuKeyLatch[code] = now;
  return now && !was;
}

// ---------------- Update ----------------
function update() {
  pollPads();
  musicUpdate();

  if (state === "menu") {
    if (menuPressed("KeyT")) toggleItems();
    if (menuPressed("ArrowUp") || menuPressed("KeyW") || padMenuPressed("navUp")) menuIndex = (menuIndex + 6) % 7;
    if (menuPressed("ArrowDown") || menuPressed("KeyS") || padMenuPressed("navDown")) menuIndex = (menuIndex + 1) % 7;
    if (menuPressed("Enter") || menuPressed("Space") || padMenuPressed("confirm")) {
      if (menuIndex === 3) { // STORY
        storySel = Math.min(getStoryUnlocked(), STORY_LEVELS.length) - 1;
        state = "storyselect";
        return;
      }
      if (menuIndex === 4) { // ONLINE
        onlineIdx = 0;
        state = "online";
        return;
      }
      gameMode = ["classic", "classic", "party", null, null, "arcade", "survival"][menuIndex];
      mode = menuIndex === 1 ? "2p" : "bot";
      openCharSelect();
    }
    return;
  }

  if (state === "storyselect") {
    if (menuPressed("Escape")) { gotoMenu(); return; }
    const unlocked = getStoryUnlocked();
    if (menuPressed("ArrowUp") || menuPressed("KeyW") || padMenuPressed("navUp")) storySel = (storySel + STORY_LEVELS.length - 1) % STORY_LEVELS.length;
    if (menuPressed("ArrowDown") || menuPressed("KeyS") || padMenuPressed("navDown")) storySel = (storySel + 1) % STORY_LEVELS.length;
    if ((menuPressed("Enter") || menuPressed("Space") || padMenuPressed("confirm")) && storySel < unlocked) {
      gameMode = "story";
      mode = "2p"; // no bots in story select
      openCharSelect();
    }
    return;
  }

  if (state === "online") {
    if (menuPressed("Escape")) { netCleanup(); gotoMenu(); return; }
    if (menuPressed("ArrowUp") || menuPressed("KeyW") || padMenuPressed("navUp")) onlineIdx = (onlineIdx + 2) % 3;
    if (menuPressed("ArrowDown") || menuPressed("KeyS") || padMenuPressed("navDown")) onlineIdx = (onlineIdx + 1) % 3;
    if (menuPressed("Enter") || menuPressed("Space") || padMenuPressed("confirm")) {
      if (onlineIdx === 0) { netCleanup(); startHost(); }
      else if (onlineIdx === 1) { netCleanup(); joinCode = ""; state = "joincode"; }
      else { netCleanup(); gotoMenu(); }
    }
    return;
  }

  if (state === "joincode") {
    if (menuPressed("Escape")) { netCleanup(); state = "online"; return; }
    if (menuPressed("Enter") && joinCode.length === 5 && (!net || net.role !== "client" || net.err)) {
      netCleanup();
      startJoin(joinCode);
    }
    return;
  }

  if (state === "lobby") {
    if (menuPressed("Escape")) { netCleanup(); gotoMenu(); return; }
    if (!net) { gotoMenu(); return; }
    const my = net.mySlot;
    if (net.lobby && my >= 0) {
      const dir = (localEdge("right") ? 1 : 0) - (localEdge("left") ? 1 : 0);
      if (dir && !net.lobby.ready[my]) {
        if (net.role === "host") { net.lobby.chars[my] = (net.lobby.chars[my] + dir + CHARACTERS.length) % CHARACTERS.length; sendLobby(); }
        else if (net.host && net.host.open) net.host.send({ t: "pick", d: dir });
      }
      if (localEdge("light")) {
        if (net.role === "host") { net.lobby.ready[my] = !net.lobby.ready[my]; sendLobby(); }
        else if (net.host && net.host.open) net.host.send({ t: "ready" });
      }
    }
    // host cycles the game mode (VERSUS / STORY chapters) with up/down
    if (net.role === "host" && net.lobby) {
      const maxCh = Math.min(getStoryUnlocked(), STORY_LEVELS.length);
      if (localEdge("down")) { net.lobby.mode = ((net.lobby.mode || 0) + 1) % (maxCh + 1); sendLobby(); }
      else if (localEdge("up")) { net.lobby.mode = ((net.lobby.mode || 0) + maxCh) % (maxCh + 1); sendLobby(); }
    }
    if (net.role === "host" && lobbyReady() && (menuPressed("Enter") || menuPressed("Space") || padMenuPressed("confirm"))) {
      const m = net.lobby.mode || 0;
      if (m > 0) { netStartStory(m - 1); return; }
      sel = { slots: 1, joined: [true], isBotSlot: [false], idx: [0], confirmed: [true] }; // shim so mapselect reads host input only
      netBroadcast({ t: "picking" });
      openMapSelect();
    }
    return;
  }

  if (state === "charselect") {
    if (menuPressed("Escape") || padMenuPressed("pause")) { gotoMenu(); return; }
    for (let i = 0; i < sel.slots; i++) {
      if (sel.isBotSlot[i]) continue;
      const e = {};
      for (const a of ["left", "right", "up", "down", "light", "heavy"]) e[a] = selEdge(i, a);
      if (!sel.joined[i]) {
        // party: an idle slot joins the moment its player touches a control
        if (e.light || e.heavy || e.up || e.left || e.right) { sel.joined[i] = true; beep(600, 0.07, "square", 0.05, 160); }
        continue;
      }
      if (!sel.confirmed[i]) {
        if (e.left)  sel.idx[i] = (sel.idx[i] + CHARACTERS.length - 1) % CHARACTERS.length;
        if (e.right) sel.idx[i] = (sel.idx[i] + 1) % CHARACTERS.length;
        if (e.down)  sel.idx[i] = (sel.idx[i] + 5) % CHARACTERS.length; // hop rows in the grid
        if (e.light || e.up) {
          if (charLocked(sel.idx[i])) beep(160, 0.15, "square", 0.06, -60); // locked!
          else { sel.confirmed[i] = true; beep(520, 0.08, "square", 0.05, 200); }
        }
        // party/story: a non-P1 player may back out with heavy before locking in
        else if (e.heavy && (gameMode === "party" || gameMode === "story") && i > 0) { sel.joined[i] = false; beep(300, 0.08, "square", 0.04, -100); }
      } else if (e.heavy) {
        sel.confirmed[i] = false; beep(300, 0.08, "square", 0.04, -100);
      }
    }
    if (selReady()) {
      sel.count++;
      if (sel.count > 30) {
        const joined = selJoinedIdx();
        for (const i of joined) fighters[i].setCharacter(CHARACTERS[sel.idx[i]]);
        if (gameMode === "arcade") { arcade = { stage: 0 }; startArcadeStage(); }
        else if (gameMode === "story") { partyRoster = joined.slice(); startStoryLevel(storySel); }
        else { if (gameMode === "party") partyRoster = joined.slice(); openMapSelect(); }
      }
    } else sel.count = 0;
    return;
  }

  if (state === "mapselect") {
    if (menuPressed("Escape") || padMenuPressed("pause")) { gotoMenu(); return; }
    if (menuPressed("KeyT") && (!net || net.role === "host")) toggleItems();
    const startChosen = () => {
      currentMap = MAPS[mapSel.idx];
      if (net && net.role === "host") netStartMatch();
      else if (gameMode === "survival") startSurvival();
      else if (gameMode === "party") startParty();
      else startMatch();
    };
    for (let i = 0; i < sel.slots; i++) {
      if (sel.isBotSlot[i] || !sel.joined[i]) continue;
      const e = {};
      for (const a of ["left", "right", "up", "down", "light", "heavy"]) e[a] = selEdge(i, a);
      if (e.left)  mapSel.idx = (mapSel.idx + MAPS.length - 1) % MAPS.length;
      if (e.right) mapSel.idx = (mapSel.idx + 1) % MAPS.length;
      if (e.down)  mapSel.idx = (mapSel.idx + 3) % MAPS.length;
      if (e.heavy) {
        if (net) { primeLocalLatch(); state = "lobby"; netBroadcast({ t: "tolobby" }); }
        else openCharSelect();
        return;
      }
      if (e.light || e.up) { startChosen(); return; }
    }
    if (menuPressed("Enter")) startChosen();
    return;
  }

  if (state === "gameover") {
    if (net) {
      if (menuPressed("Escape")) { netCleanup(); gotoMenu(); return; }
      // host: retry a failed story chapter, or send everyone back to the lobby
      if (net.role === "host" && (menuPressed("Enter") || menuPressed("Space") || padMenuPressed("confirm"))) {
        if (gameMode === "story" && gameOver && gameOver.retry) { net.sentOver = false; netStartStory(story.chapter); return; }
        net.lobby.ready = [false, false, false, false];
        net.sentOver = false;
        netBroadcast({ t: "tolobby" });
        primeLocalLatch();
        state = "lobby";
        sendLobby();
      }
      return;
    }
    if (gameMode === "story" && gameOver && gameOver.retry) {
      if (menuPressed("Enter") || menuPressed("Space") || padMenuPressed("confirm")) { startStoryLevel(story.chapter); return; }
      if (menuPressed("Escape")) gotoMenu();
      return;
    }
    if (menuPressed("Enter") || menuPressed("Space") || menuPressed("Escape") || padMenuPressed("confirm")) gotoMenu();
    return;
  }

  // playing
  if (menuPressed("Escape") || padMenuPressed("pause")) { gotoMenu(); return; }
  if (net && net.role === "client") { clientNetTick(); return; } // clients render host snapshots
  if (banner && banner.t > 0) banner.t--;
  if (hitstop > 0) { hitstop--; return; }

  // special-move cutscene: the whole world holds its breath
  if (cutscene) {
    cutscene.t++;
    if (cutscene.t === cutscene.total && !cutscene.applied) { cutscene.applied = true; applySpecial(cutscene.f); }
    if (cutscene.t > cutscene.total + 15) cutscene = null;
    // keep clients in sync while frozen
    if (net && net.role === "host") netBroadcast(buildSnapshot());
    return;
  }

  for (const f of combatants) if (f.isBot && !f.dead) botThink(f, p1);

  for (const f of combatants) f.update();

  // hit resolution: every attacker vs every other fighter (no friendly fire in story)
  if (gameMode !== "story") {
    for (const atkP of combatants) {
      if (!atkP.attack || atkP.dead) continue;
      const hb = atkP.hitbox();
      if (!hb) continue;
      for (const defP of combatants) {
        if (defP === atkP || defP.dead) continue;
        if (atkP.attack.hitSet.has(defP)) continue;
        if (defP.invuln > 0 || defP.dodgeT > 0) continue;
        if (rectsOverlap(hb, defP.rect)) {
          atkP.attack.hitSet.add(defP);
          defP.takeHit(atkP.attack, atkP);
        }
      }
    }
  } else {
    updateStory();
    if (state !== "playing") return; // chapter ended this frame
  }

  // items: rare spawn every 15 seconds (when enabled), max 2 waiting
  if (matchItems) {
    itemTimer++;
    if (itemTimer >= 900 && items.length < 2) { spawnItemPickup(); itemTimer = 0; }
  }
  updateItems();

  // particles
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life--;
  }
  particles = particles.filter(p => p.life > 0);
  if (shake > 0) shake *= 0.86;

  // mode-specific flow
  if (gameMode === "survival") {
    for (const f of combatants) if (f !== p1 && f.dead) { surv.score++; sfx.ko(); }
    combatants = combatants.filter(f => f === p1 || !f.dead);
    const aliveBots = combatants.length - 1;
    surv.spawnT--;
    if (surv.spawnT <= 0 && aliveBots < 3) {
      spawnSurvivalBot();
      surv.interval = Math.max(360, surv.interval - 60); // waves come faster and faster
      surv.spawnT = surv.interval;
    }
    if (p1.dead) {
      const isNew = surv.score > surv.best;
      if (isNew) setHighScore(surv.score);
      gameOver = {
        title: "SURVIVAL OVER",
        sub: isNew ? "NEW BEST:  " + surv.score + "   (old best " + surv.best + ")"
                   : "Score  " + surv.score + "   ·   Best  " + surv.best,
        color: isNew ? "#ffe680" : "#ff6b4d",
      };
      state = "gameover"; menuKeyLatch = {};
    }
  } else if (gameMode === "arcade") {
    if (p1.dead) endArcade(false);
    else if (p2.dead) {
      arcade.stage++;
      if (arcade.stage >= CHARACTERS.length) endArcade(true);
      else startArcadeStage();
    }
  } else {
    // classic (2) or party (2-4): last fighter standing wins
    const alive = combatants.filter(f => !f.dead);
    if (alive.length <= 1 && combatants.length > 1) {
      const w = alive[0] || combatants[0];
      gameOver = { title: (w.isBot ? "BOT" : w.name) + "  WINS!", sub: "", color: w.color };
      state = "gameover"; menuKeyLatch = {};
    }
  }

  // host streams the world to the clients
  if (net && net.role === "host") {
    if (state === "playing") netBroadcast(buildSnapshot());
    else if (state === "gameover" && !net.sentOver) {
      net.sentOver = true;
      netBroadcast(buildSnapshot());
      netBroadcast({ t: "over", go: gameOver });
    }
  }
}

// ---------------- Drawing ----------------
function drawBackground(map = currentMap) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, map.sky[0]);
  g.addColorStop(0.6, map.sky[1]);
  g.addColorStop(1, map.sky[2]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  drawSceneryBack(map);   // moons, suns, auroras, volcanoes — behind everything
  // themed ambience (stars, embers, snow, rain, fireflies...)
  drawAmbient(map);

  if (map.theme === "rain") {
    // neon city skyline with lit windows
    for (let b = 0; b < 12; b++) {
      const r = Math.abs(Math.sin(b * 91.3)) % 1;
      const bw = 70 + r * 70;
      const bh = 130 + ((b * 73) % 200);
      const bx = b * 112 - 30;
      ctx.fillStyle = map.mountain;
      ctx.fillRect(bx, 660 - bh, bw, bh);
      ctx.fillStyle = "rgba(125,240,255,0.3)";
      for (let wy = 0; wy < 6; wy++) for (let wx = 0; wx < 3; wx++) {
        if ((b * 7 + wy * 3 + wx) % 3 === 0) ctx.fillRect(bx + 12 + wx * 18, 660 - bh + 14 + wy * 26, 8, 10);
      }
    }
    ctx.fillStyle = map.mountain;
    ctx.fillRect(0, 655, W, H - 655);
  } else {
    // distant mountains
    ctx.fillStyle = map.mountain;
    ctx.beginPath();
    ctx.moveTo(0, 620);
    for (let x = 0; x <= W; x += 80) {
      ctx.lineTo(x + 40, 620 - 60 - 50 * Math.abs(Math.sin(x * 0.013)));
      ctx.lineTo(x + 80, 620);
    }
    ctx.lineTo(W, H); ctx.lineTo(0, H);
    ctx.closePath(); ctx.fill();
  }

  drawSceneryFront(map);  // snow caps, lava sea, hall columns, ruins
}

function drawSceneryBack(map) {
  const t = perf;
  switch (map.key) {

    case "skyholm": { // full moon with craters, drifting clouds
      ctx.fillStyle = "rgba(225,238,255,0.08)";
      ctx.beginPath(); ctx.arc(1020, 140, 88, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#dfe8ff";
      ctx.beginPath(); ctx.arc(1020, 140, 52, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(165,180,215,0.55)";
      ctx.beginPath(); ctx.arc(1000, 124, 9, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(1040, 150, 12, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(1012, 162, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(200,215,255,0.06)";
      for (let i = 0; i < 4; i++) {
        const cxx = ((i * 380 + t * (0.010 + i * 0.003)) % (W + 320)) - 160;
        const cyy = 150 + i * 75;
        ctx.beginPath();
        ctx.arc(cxx, cyy, 38, 0, Math.PI * 2);
        ctx.arc(cxx + 36, cyy + 9, 28, 0, Math.PI * 2);
        ctx.arc(cxx - 32, cyy + 11, 24, 0, Math.PI * 2);
        ctx.fill();
      }
      break;
    }

    case "pillars": { // huge setting sun, circling birds
      ctx.fillStyle = "rgba(255,140,80,0.13)";
      ctx.beginPath(); ctx.arc(W/2, 590, 155, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ff9a5c";
      ctx.beginPath(); ctx.arc(W/2, 590, 88, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = map.sky[1]; // banding across the sun
      ctx.fillRect(W/2 - 95, 566, 190, 6);
      ctx.fillRect(W/2 - 95, 542, 190, 4);
      ctx.strokeStyle = "#1a0a14"; ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        const bx = ((i * 330 + t * 0.02) % (W + 200)) - 100;
        const by = 190 + i * 55 + Math.sin(t * 0.002 + i * 2) * 12;
        ctx.beginPath();
        ctx.moveTo(bx - 9, by);
        ctx.quadraticCurveTo(bx - 4, by - 6, bx, by);
        ctx.quadraticCurveTo(bx + 4, by - 6, bx + 9, by);
        ctx.stroke();
      }
      break;
    }

    case "frost": { // aurora borealis ribbons
      ctx.lineCap = "round";
      for (let b = 0; b < 3; b++) {
        const a = 0.05 + 0.045 * Math.abs(Math.sin(t * 0.0011 + b * 1.7));
        ctx.strokeStyle = b % 2 ? `rgba(120,255,190,${a})` : `rgba(140,185,255,${a})`;
        ctx.lineWidth = 26;
        ctx.beginPath();
        for (let x = -20; x <= W + 20; x += 40) {
          const y = 105 + b * 46 + Math.sin(x * 0.008 + t * 0.0012 + b * 2.1) * 38;
          if (x === -20) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      break;
    }

    case "magma": { // erupting volcano silhouette
      ctx.fillStyle = "#200806";
      ctx.beginPath();
      ctx.moveTo(110, 680); ctx.lineTo(295, 295); ctx.lineTo(345, 295); ctx.lineTo(540, 680);
      ctx.closePath(); ctx.fill();
      const pulse = 0.30 + 0.20 * Math.abs(Math.sin(t * 0.003));
      ctx.fillStyle = `rgba(255,130,45,${pulse})`;
      ctx.beginPath(); ctx.arc(320, 296, 27, 0, Math.PI * 2); ctx.fill();
      // sparks rising from the crater
      ctx.fillStyle = "#ffb14d";
      for (let i = 0; i < 8; i++) {
        const ph = ((t * 0.045 + i * 53) % 170);
        ctx.globalAlpha = Math.max(0, 0.7 - ph / 170);
        ctx.fillRect(320 + Math.sin(t * 0.004 + i * 2.4) * (6 + ph * 0.15), 292 - ph, 3, 3);
      }
      ctx.globalAlpha = 1;
      break;
    }
  }
}

function drawSceneryFront(map) {
  const t = perf;
  switch (map.key) {

    case "frost": { // white caps on every peak
      ctx.fillStyle = "rgba(240,248,255,0.85)";
      for (let x = 0; x <= W; x += 80) {
        const py = 620 - 60 - 50 * Math.abs(Math.sin(x * 0.013));
        const ly = py + (620 - py) * 0.32;
        ctx.beginPath();
        ctx.moveTo(x + 40, py);
        ctx.lineTo(x + 27, ly);
        ctx.lineTo(x + 36, ly - 5);
        ctx.lineTo(x + 45, ly + 3);
        ctx.lineTo(x + 53, ly);
        ctx.closePath(); ctx.fill();
      }
      break;
    }

    case "magma": { // animated lava sea with waves and bubbles
      const top = 655;
      const g = ctx.createLinearGradient(0, top, 0, H);
      g.addColorStop(0, "#8a2408");
      g.addColorStop(1, "#ff8a2a");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(0, top + Math.sin(t * 0.0025) * 6);
      for (let x = 40; x <= W; x += 40) ctx.lineTo(x, top + Math.sin(x * 0.02 + t * 0.0025) * 6);
      ctx.lineTo(W, H); ctx.lineTo(0, H);
      ctx.closePath(); ctx.fill();
      for (let i = 0; i < 10; i++) {
        const r = Math.abs(Math.sin(i * 127.1 + 311.7) * 43758.55) % 1;
        const ph = (t * 0.0018 + r * 7) % 1;
        ctx.fillStyle = `rgba(255,195,85,${0.55 * (1 - ph)})`;
        ctx.beginPath();
        ctx.arc(r * W, top + 14 + r * 38, 2 + ph * 6, 0, Math.PI * 2);
        ctx.fill();
      }
      break;
    }

    case "hall": { // arched windows, light shafts, columns and banners
      for (let i = 0; i < 3; i++) {
        const wx = 210 + i * 380;
        ctx.fillStyle = "rgba(180,255,210,0.055)";
        ctx.beginPath();
        ctx.moveTo(wx, 200); ctx.lineTo(wx, 430); ctx.lineTo(wx + 90, 430); ctx.lineTo(wx + 90, 200);
        ctx.arc(wx + 45, 200, 45, 0, Math.PI, true);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = "rgba(180,255,210,0.03)"; // moonbeam shaft
        ctx.beginPath();
        ctx.moveTo(wx, 430); ctx.lineTo(wx + 90, 430); ctx.lineTo(wx + 160, 700); ctx.lineTo(wx - 50, 700);
        ctx.closePath(); ctx.fill();
      }
      for (let i = 0; i < 4; i++) {
        const colx = 55 + i * 380;
        ctx.fillStyle = "rgba(18,48,38,0.6)";
        ctx.fillRect(colx, 150, 46, 550);
        ctx.fillRect(colx - 9, 150, 64, 18);
        ctx.fillRect(colx - 9, 645, 64, 22);
      }
      for (let i = 0; i < 3; i++) {
        const bx = 158 + i * 380;
        ctx.fillStyle = "#14382a";
        ctx.beginPath();
        ctx.moveTo(bx, 150); ctx.lineTo(bx + 66, 150); ctx.lineTo(bx + 33, 262);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = "rgba(255,230,128,0.22)";
        ctx.fillRect(bx, 150, 66, 7);
      }
      break;
    }

    case "pillars": { // ruined arches on the horizon
      ctx.fillStyle = "#1d0a18";
      for (const ax of [140, 1010]) {
        ctx.fillRect(ax, 556, 22, 64);
        ctx.fillRect(ax + 72, 556, 22, 64);
        ctx.fillRect(ax - 8, 542, 110, 16);
      }
      break;
    }
  }
}

function drawAmbient(map) {
  const t = perf;
  const rnd = i => Math.abs(Math.sin(i * 127.1 + 311.7) * 43758.55) % 1;
  switch (map.theme) {
    case "stars": {
      ctx.fillStyle = "rgba(255,255,255,0.5)";
      for (let i = 0; i < 60; i++) {
        const x = (i * 211.7) % W;
        const y = (i * 137.3) % (H * 0.7);
        ctx.globalAlpha = (0.4 + 0.6 * Math.abs(Math.sin(t * 0.001 + i))) * 0.6;
        ctx.fillRect(x, y, 2, 2);
      }
      break;
    }
    case "lava":
    case "embers": {
      if (map.theme === "lava") {
        const g = ctx.createLinearGradient(0, H - 180, 0, H);
        g.addColorStop(0, "rgba(255,90,20,0)");
        g.addColorStop(1, "rgba(255,120,30,0.45)");
        ctx.fillStyle = g;
        ctx.fillRect(0, H - 180, W, 180);
      }
      ctx.fillStyle = map.themeColor;
      for (let i = 0; i < 36; i++) {
        const r = rnd(i);
        const x = r * W + Math.sin(t * 0.0012 + i * 1.7) * 34;
        const y = H - ((t * (0.035 + r * 0.05) + i * 173) % (H + 80)) + 40;
        ctx.globalAlpha = 0.25 + 0.45 * Math.abs(Math.sin(t * 0.004 + i));
        ctx.fillRect(x, y, 3, 3);
      }
      break;
    }
    case "snow": {
      ctx.fillStyle = "#ffffff";
      for (let i = 0; i < 50; i++) {
        const r = rnd(i);
        const x = (r * W + Math.sin(t * 0.0016 + i) * 46 + i * 7) % W;
        const y = ((t * (0.045 + r * 0.05) + i * 131) % (H + 40)) - 20;
        ctx.globalAlpha = 0.35 + r * 0.4;
        ctx.fillRect(x, y, 3, 3);
      }
      break;
    }
    case "rain": {
      ctx.strokeStyle = map.themeColor;
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 46; i++) {
        const r = rnd(i);
        const x = (r * W + ((t * (0.5 + r * 0.4) + i * 211) / (H + 60) | 0) * 37) % W;
        const y = ((t * (0.5 + r * 0.4) + i * 211) % (H + 60)) - 30;
        ctx.globalAlpha = 0.15 + r * 0.25;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 3, y + 14); ctx.stroke();
      }
      break;
    }
    case "fireflies": {
      ctx.fillStyle = map.themeColor;
      for (let i = 0; i < 22; i++) {
        const r = rnd(i);
        const x = r * W + Math.sin(t * 0.0007 + i * 2.1) * 70;
        const y = H * 0.25 + rnd(i + 50) * H * 0.55 + Math.cos(t * 0.0009 + i * 1.3) * 40;
        const a = 0.25 + 0.55 * Math.abs(Math.sin(t * 0.003 + i * 2));
        ctx.globalAlpha = a;
        ctx.beginPath(); ctx.arc(x, y, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = a * 0.25;
        ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fill();
      }
      break;
    }
  }
  ctx.globalAlpha = 1;
}

function drawStage() {
  for (const p of platforms) {
    if (p.solid) {
      // floating asgard-rock main stage
      ctx.fillStyle = currentMap.rock;
      roundRect(p.x, p.y, p.w, p.h, 14); ctx.fill();
      ctx.fillStyle = currentMap.rockTop;
      roundRect(p.x, p.y, p.w, 18, 8); ctx.fill();
      // rocky underside
      ctx.fillStyle = currentMap.rockUnder;
      ctx.beginPath();
      ctx.moveTo(p.x + 30, p.y + p.h);
      ctx.lineTo(p.x + p.w/2, p.y + p.h + 70);
      ctx.lineTo(p.x + p.w - 30, p.y + p.h);
      ctx.closePath(); ctx.fill();
    } else {
      ctx.fillStyle = currentMap.rockTop;
      roundRect(p.x, p.y, p.w, p.h, 8); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.25)";
      ctx.fillRect(p.x + 4, p.y + 2, p.w - 8, 3);
    }
  }
}

function damageColor(dmg) {
  // white -> orange -> deep red as damage rises (Brawlhalla-style)
  const t = Math.min(1, dmg / 180);
  const r = 255;
  const g = Math.round(255 - 200 * t);
  const b = Math.round(255 - 255 * Math.min(1, t * 1.6));
  return `rgb(${r},${g},${b})`;
}

function drawBadge(f, cx, label) {
  ctx.beginPath();
  ctx.arc(cx, 70, 34, 0, Math.PI * 2);
  ctx.fillStyle = damageColor(f.damage);
  ctx.fill();
  ctx.lineWidth = 5;
  ctx.strokeStyle = f.color;
  ctx.stroke();
  ctx.fillStyle = "#1a1a2e";
  ctx.font = "bold 22px 'Segoe UI', Arial";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(Math.round(f.damage), cx, 71);
  ctx.fillStyle = f.color;
  ctx.font = "bold 16px 'Segoe UI', Arial";
  ctx.fillText(label, cx, 22);
  for (let s = 0; s < 3; s++) {
    ctx.beginPath();
    ctx.arc(cx - 26 + s * 26, 118, 8, 0, Math.PI * 2);
    ctx.fillStyle = s < f.stocks ? f.color : "rgba(255,255,255,0.12)";
    ctx.fill();
  }
}

function drawOffscreenArrow(f, ox = 0) {
  if (f.dead) return;
  const px = f.x - ox;
  if (px > 0 && px < W && f.y - f.h > 0 && f.y < H) return;
  const ax = Math.max(30, Math.min(W - 30, px));
  const ay = Math.max(30, Math.min(H - 30, f.y - f.h/2));
  const ang = Math.atan2((f.y - f.h/2) - ay, px - ax);
  ctx.save();
  ctx.translate(ax, ay);
  ctx.rotate(ang);
  ctx.fillStyle = f.color;
  ctx.beginPath();
  ctx.moveTo(16, 0); ctx.lineTo(-10, -11); ctx.lineTo(-10, 11);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
